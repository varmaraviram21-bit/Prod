 dictionary.", "Loop through each character in text.", "Use dict.get(ch, 0) + 1 to update the count for each character."]}, {"topicName": "Frequency Problems", "type": "mcq", "topic": "Counter", "level": "Advanced", "question": "Which class from the collections module is designed for counting items efficiently?", "code": "", "options": ["Counter", "OrderedDict", "deque", "namedtuple"], "answer": 0, "hints": ["This class builds a dictionary-like frequency map automatically.", "It is commonly used for counting characters or words.", "That class is collections.Counter."]}, {"topicName": "Palindrome & Anagram", "type": "mcq", "topic": "palindrome check", "level": "Beginner", "question": "What is printed?", "code": "s = 'level'\nprint(s == s[::-1])", "options": ["True", "False", "Error", "'level'"], "answer": 0, "hints": ["s[::-1] reverses the string.", "'level' reversed is still 'level'.", "Since they match, the result is True."]}, {"topicName": "Palindrome & Anagram", "type": "mcq", "topic": "anagram check", "level": "Intermediate", "question": "What is printed?", "code": "print(sorted('listen') == sorted('silent'))", "options": ["True", "False", "Error", "None"], "answer": 0, "hints": ["Anagrams contain exactly the same letters, just rearranged.", "Sorting both words produces identical letter sequences.", "Since the sorted letters match, this is True."]}, {"topicName": "Palindrome & Anagram", "type": "code", "topic": "palindrome + normalization", "level": "Advanced", "question": "Write a function that checks if a phrase is a palindrome, ignoring case and spaces.", "code": "def is_palindrome(text):\n    # Write your solution here", "options": [], "answer": null, "hints": ["Normalize the text first: lowercase it and remove spaces.", "Compare the normalized text to its reverse.", "Return True only if they match exactly."]}, {"topicName": "Advanced String Problems", "type": "mcq", "topic": "first non-repeating character", "level": "Advanced", "question": "Which approach efficiently finds the first non-repeating character in a string?", "code": "", "options": ["Count frequencies with a dict first, then scan in order for count == 1", "Sort the string and check the first character", "Reverse the string and check the last character", "Use max() on the string"], "answer": 0, "hints": ["You need both frequency information and the original order.", "A dictionary can record how many times each character occurs.", "Then scan the string in its original order and return the first character with a count of 1."]}, {"topicName": "Advanced String Problems", "type": "code", "topic": "remove duplicates, preserve order", "level": "Advanced", "question": "Remove duplicate characters from a string while preserving the original order.", "code": "text = 'programming'\n# Write your solution here", "options": [], "answer": null, "hints": ["Keep track of characters already seen, using a set.", "Loop through the string in order.", "Only keep a character the first time it is seen."]}, {"topicName": "Advanced String Problems", "type": "mcq", "topic": "strip() scope", "level": "Interview", "question": "Which method removes leading and trailing whitespace only, leaving internal spaces untouched?", "code": "", "options": ["strip()", "replace(' ', '')", "split()", "lower()"], "answer": 0, "hints": ["Some methods affect the whole string; this one only affects the edges.", "It trims whitespace from the start and end.", "That method is strip()."]}]};
let attempts={},solved={},score=0;
function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderHome(){app.innerHTML=`<div class="card"><h2>🧵 Python Strings</h2><p>From basic strings to advanced interview problems. Previous concepts such as for loops, lists and built-ins are mixed into later questions.</p></div><div class="grid"><div class="card click" onclick="learn()"><span class="badge">11 topics</span><h2>📖 Learn</h2><p>Definition → use case → example → interview focus.</p></div><div class="card click" onclick="practice()"><span class="badge">100 questions</span><h2>🎯 Practice</h2><p>Immediate MCQ feedback and hints for wrong answers.</p></div></div>`}
const explain={
"String Basics":["A string is an immutable sequence of characters.","Used for names, messages, commands and text processing.","s='Python'\nprint(s)"],
"Indexing & Slicing":["Indexing accesses characters; slicing extracts portions.","Useful for substrings, reversing and position-based processing.","s='Python'\nprint(s[0])\nprint(s[1:4])\nprint(s[::-1])"],
"String Operators":["+ concatenates, * repeats, and in/not in checks membership.","Useful for formatting and simple validation.","print('Hi '+'Ravi')\nprint('ha'*3)"],
"String Methods":["Methods provide common transformations, searches and checks.","Know return values and remember strings are immutable.","s='  Python  '\nprint(s.strip().upper())"],
"Strings + For Loops":["Strings are iterable, so loops can process each character.","Used for counting, filtering, validation and interview patterns.","for ch in 'Python':\n    print(ch)"],
"Strings + Lists":["split converts text into a list; join combines strings.","Useful for sentence and word processing.","words='Python is fun'.split()\nprint(' '.join(words))"],
"Built-ins + Strings":["Built-ins such as len, sorted, min and max work with strings.","Useful for length, ordering and selecting values.","print(len('Python'))\nprint(sorted('cab'))"],
"Comprehensions":["Comprehensions build collections from iterables with optional filtering.","Useful for compact transformations when readability remains good.","[x.upper() for x in 'abc']"],
"Frequency Problems":["Frequency questions ask how often characters or words occur.","Use count for simple cases and dictionaries for general frequency maps.","'banana'.count('a')"],
"Palindrome & Anagram":["Palindromes read the same backward; anagrams use the same characters and frequencies.","Common screening questions testing normalization and comparison.","'level' == 'level'[::-1]"],
"Advanced String Problems":["Advanced questions combine normalization, loops, lists, dictionaries and built-ins.","Focus on correctness, edge cases and time/space complexity.","# normalize -> process -> compare"]
};
function learn(){let x='<button class="secondary" onclick="renderHome()">← Home</button><div class="card"><h2>📖 String Topics</h2></div><div class="grid">';DATA.topics.forEach((t,i)=>x+=`<div class="card click" onclick="topic(${i})"><span class="badge">${esc(t[1])}</span><h3>${esc(t[0])}</h3><p>${esc(t[2])}</p></div>`);x+='</div>';app.innerHTML=x}
function topic(i){let t=DATA.topics[i],e=explain[t[0]];app.innerHTML=`<button class="secondary" onclick="learn()">← Topics</button><div class="card"><span class="badge">${esc(t[1])}</span><h2>${esc(t[0])}</h2><h3 class="section">Definition</h3><p>${esc(e[0])}</p><h3 class="section">Use case</h3><p>${esc(e[1])}</p><h3 class="section">Example</h3><pre>${esc(e[2])}</pre><h3 class="section">Interview focus</h3><p>Know syntax, behavior, return values, edge cases and how this concept combines with previous topics.</p><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="primary" onclick="practice()">Practice this module (all 100)</button><button class="primary" onclick="practiceTopic(${i})">Practice ${esc(t[0])} only</button></div></div>`}
function practice(){attempts={};solved={};score=0;app.innerHTML=`<button class="secondary" onclick="renderHome()">← Home</button><div class="card"><h2>🎯 100 String Questions</h2><p>Wrong answers never reveal the direct answer on the first attempts. Hints become progressively more specific.</p><div class="stats"><div class="stat" id="score">Score: 0 / 0</div><div class="stat">100 Questions</div></div></div><div id="questions"></div>`;DATA.questions.forEach(q=>makeQuestion(q))}
function makeQuestion(q){let d=document.createElement('div');d.className='question';d.id='q'+q.id;let controls=q.type==='mcq'?q.options.map((o,j)=>`<label class="opt" data-o="${j}"><input type="radio" name="q${q.id}" onchange="answer(${q.id},${j})"><span><b>${'ABCD'[j]}.</b> ${esc(o)}</span></label>`).join(''):`<textarea id="code${q.id}" placeholder="Write your Python solution here..."></textarea><button class="primary" onclick="submitCode(${q.id})">Check Code</button><div class="result" id="result${q.id}"></div>`;d.innerHTML=`<span class="badge">${esc(q.topic)} • ${esc(q.level)}</span><h3>${q.id}. ${esc(q.question)}</h3><pre>${esc(q.code)}</pre>${controls}<div id="fb${q.id}"></div><div id="hint${q.id}" class="hint" style="display:none"></div>`;questions.appendChild(d)}
function answer(id,choice){let q=DATA.questions.find(x=>x.id===id);if(solved[id])return;attempts[id]=(attempts[id]||0)+1;let n=attempts[id],d=document.getElementById('q'+id),fb=document.getElementById('fb'+id),h=document.getElementById('hint'+id);d.querySelectorAll('.opt').forEach(x=>x.classList.remove('correct','wrong'));d.querySelector(`[data-o="${choice}"]`).classList.add(choice===q.answer?'correct':'wrong');if(choice===q.answer){solved[id]=1;score++;fb.innerHTML='<p class="ok">✓ Correct!</p>';h.style.display='none'}else{fb.innerHTML='<p class="no">✗ Wrong — answer hidden.</p>';h.style.display='block';h.innerHTML='<b>💡 Hint '+Math.min(n,q.hints.length)+'</b><br>'+esc(q.hints[Math.min(n,q.hints.length)-1]);if(n>=3){h.innerHTML+='<br><small>Try solving again using the hints before moving on.</small>'}}updateScore()}
function submitCode(id){let v=document.getElementById('code'+id).value.trim(),q=DATA.questions.find(x=>x.id===id),r=document.getElementById('result'+id);if(!v){r.textContent='Please enter your code first.';return}if(!solved[id]){solved[id]=1;score++}r.innerHTML='<b>Submitted.</b> Self-check approach: '+esc(codeExpected(q));updateScore()}
function codeExpected(q){return q.hints.join(' ')}
function updateScore(){let done=Object.keys(solved).length;document.getElementById('score').textContent='Score: '+score+' / '+done}

const LEVEL_ORDER={"Beginner":0,"Intermediate":1,"Advanced":2,"Interview":3};
let topicAttempts={},topicSolved={},topicScore=0,currentTopicSet=[];
function practiceTopic(i){
  const t=DATA.topics[i];
  currentTopicSet=DATA.topicQuestions.filter(q=>q.topicName===t[0]).sort((a,b)=>LEVEL_ORDER[a.level]-LEVEL_ORDER[b.level]);
  topicAttempts={};topicSolved={};topicScore=0;
  app.innerHTML=`<button class="secondary" onclick="topic(${i})">← ${esc(t[0])}</button><div class="card"><h2>🎯 ${esc(t[0])} — Practice</h2><p>Unique basic-to-advanced questions for this topic only (separate from the main 100-question bank).</p><div class="stats"><div class="stat" id="tscore">Score: 0 / 0</div><div class="stat">${currentTopicSet.length} Questions</div></div></div><div id="tquestions"></div>`;
  currentTopicSet.forEach((q,idx)=>makeTopicQuestion(q,idx));
}
function makeTopicQuestion(q,idx){let d=document.createElement('div');d.className='question';d.id='tq'+idx;let controls=q.type==='mcq'?q.options.map((o,j)=>`<label class="opt" data-o="${j}"><input type="radio" name="tq${idx}" onchange="topicAnswer(${idx},${j})"><span><b>${'ABCD'[j]}.</b> ${esc(o)}</span></label>`).join(''):`<textarea id="tcode${idx}" placeholder="Write your Python solution here..."></textarea><button class="primary" onclick="topicSubmitCode(${idx})">Check Code</button><div class="result" id="tresult${idx}"></div>`;d.innerHTML=`<span class="badge">${esc(q.topic)} • ${esc(q.level)}</span><h3>${idx+1}. ${esc(q.question)}</h3>${q.code?`<pre>${esc(q.code)}</pre>`:''}${controls}<div id="tfb${idx}"></div><div id="thint${idx}" class="hint" style="display:none"></div>`;tquestions.appendChild(d)}
function topicAnswer(idx,choice){let q=currentTopicSet[idx];if(topicSolved[idx])return;topicAttempts[idx]=(topicAttempts[idx]||0)+1;let n=topicAttempts[idx],d=document.getElementById('tq'+idx),fb=document.getElementById('tfb'+idx),h=document.getElementById('thint'+idx);d.querySelectorAll('.opt').forEach(x=>x.classList.remove('correct','wrong'));d.querySelector(`[data-o="${choice}"]`).classList.add(choice===q.answer?'correct':'wrong');if(choice===q.answer){topicSolved[idx]=1;topicScore++;fb.innerHTML='<p class="ok">✓ Correct!</p>';h.style.display='none'}else{fb.innerHTML='<p class="no">✗ Wrong — answer hidden.</p>';h.style.display='block';h.innerHTML='<b>💡 Hint '+Math.min(n,q.hints.length)+'</b><br>'+esc(q.hints[Math.min(n,q.hints.length)-1])}updateTopicScore()}
function topicSubmitCode(idx){let v=document.getElementById('tcode'+idx).value.trim(),q=currentTopicSet[idx],r=document.getElementById('tresult'+idx);if(!v){r.textContent='Please enter your code first.';return}if(!topicSolved[idx]){topicSolved[idx]=1;topicScore++}r.innerHTML='<b>Submitted.</b> Self-check approach: '+esc(q.hints.join(' '));updateTopicScore()}
function updateTopicScore(){let done=Object.keys(topicSolved).length;document.getElementById('tscore').textContent='Score: '+topicScore+' / '+done}

renderHome();
</script></body></html>
