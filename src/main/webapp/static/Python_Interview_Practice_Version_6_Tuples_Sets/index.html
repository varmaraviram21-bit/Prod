responding elements.", "The result remains a tuple."], "id": 9}, {"type": "mcq", "topic": "Tuple Operations", "level": "Beginner", "q": "What is printed?", "code": "t=(1,2)\nprint(t*3)", "options": ["(3,6)", "(1,2,1,2,1,2)", "(1,1,1,2,2,2)", "Error"], "answer": 1, "hints": ["Tuple multiplication repeats the sequence.", "It does not multiply each element.", "The pair appears three times."], "id": 10}, {"type": "mcq", "topic": "Tuple Methods & Built-ins", "level": "Beginner", "q": "What does t.count(2) return?", "code": "t=(1,2,2,3,2)", "options": ["1", "2", "3", "5"], "answer": 2, "hints": ["count() counts occurrences.", "The value 2 appears three times.", "So the result is 3."], "id": 11}, {"type": "mcq", "topic": "Tuple Methods & Built-ins", "level": "Beginner", "q": "What does t.index(30) return?", "code": "t=(10,20,30,40)", "options": ["0", "1", "2", "30"], "answer": 2, "hints": ["index() returns the position.", "Indexing starts at zero.", "30 is the third element."], "id": 12}, {"type": "code", "topic": "Tuple Methods & Built-ins", "level": "Intermediate", "q": "Find the maximum value in a tuple.", "code": "t=(14,5,27,9)\n# Write your solution here", "expected": "Use max(t).", "hints": ["Python has a built-in for the largest item.", "Pass the tuple to max().", "Do not manually sort unless asked."], "id": 13}, {"type": "code", "topic": "Tuple Methods & Built-ins", "level": "Interview", "q": "Calculate the sum and average of a tuple of numbers.", "code": "t=(10,20,30,40)\n# Write your solution here", "expected": "Use sum(t) and divide by len(t).", "hints": ["sum() gives the total.", "len() gives the number of elements.", "Average = total / count."], "id": 14}, {"type": "mcq", "topic": "Tuple Unpacking", "level": "Beginner", "q": "What is printed?", "code": "a,b,c=(10,20,30)\nprint(b)", "options": ["10", "20", "30", "(10,20,30)"], "answer": 1, "hints": ["Unpacking assigns elements in order.", "a gets 10.", "b gets the second value."], "id": 15}, {"type": "code", "topic": "Tuple Unpacking", "level": "Intermediate", "q": "Swap two variables using tuple unpacking.", "code": "a=10\nb=20\n# Write your solution here", "expected": "Use a, b = b, a.", "hints": ["Python can unpack a tuple-like expression.", "Place the old b on the left side's a position.", "No temporary variable is required."], "id": 16}, {"type": "code", "topic": "Tuple Unpacking", "level": "Intermediate", "q": "Use extended unpacking to store the first value in first, the last in last, and all middle values in middle.", "code": "values=(10,20,30,40,50)\n# Write your solution here", "expected": "Use first, *middle, last = values.", "hints": ["Extended unpacking uses *.", "The first variable gets the first item.", "The starred variable collects the middle items."], "id": 17}, {"type": "mcq", "topic": "Tuple Unpacking", "level": "Interview", "q": "What is printed?", "code": "a,*b=(1,2,3,4)\nprint(b)", "options": ["2", "[2,3,4]", "(2,3,4)", "[1,2,3]"], "answer": 1, "hints": ["A starred unpacking target collects remaining values.", "It collects into a list.", "The remaining values are 2, 3 and 4."], "id": 18}, {"type": "mcq", "topic": "Sets Basics", "level": "Beginner", "q": "What is a key property of a set?", "code": "", "options": ["It stores only duplicate values", "It stores unique elements", "It stores key-value pairs", "It is always sorted"], "answer": 1, "hints": ["Sets automatically eliminate duplicate elements.", "They are useful for uniqueness and membership tests.", "A dictionary stores key-value pairs."], "id": 19}, {"type": "mcq", "topic": "Sets Basics", "level": "Beginner", "q": "What is printed?", "code": "s={1,2,2,3,3,3}\nprint(len(s))", "options": ["3", "6", "2", "1"], "answer": 0, "hints": ["Duplicate values are stored once.", "The unique values are 1, 2 and 3.", "Therefore the set has length 3."], "id": 20}, {"type": "code", "topic": "Sets Basics", "level": "Beginner", "q": "Create a set containing 1, 2, 3 and print whether 2 is present.", "code": "# Write your solution here", "expected": "Create s={1,2,3} and use 2 in s.", "hints": ["Use curly braces for a non-empty set.", "The in operator checks membership.", "print the boolean result."], "id": 21}, {"type": "mcq", "topic": "Sets Basics", "level": "Beginner", "q": "How do you create an empty set?", "code": "", "options": ["{}", "set()", "[]", "()"], "answer": 1, "hints": ["{} is an empty dictionary.", "set() explicitly creates an empty set.", "Lists and tuples use [] and ()."], "id": 22}, {"type": "mcq", "topic": "Sets + Lists + Strings", "level": "Intermediate", "q": "What is printed?", "code": "s=set([1,2,2,3,3])\nprint(s)", "options": ["{1,2,2,3,3}", "{1,2,3}", "[1,2,3]", "Error"], "answer": 1, "hints": ["set() converts the list to a set.", "Duplicates are removed.", "The result is a set."], "id": 23}, {"type": "mcq", "topic": "Set Operations", "level": "Intermediate", "q": "What is the union of {1,2} and {2,3}?", "code": "a={1,2}\nb={2,3}\nprint(a | b)", "options": ["{2}", "{1,2,3}", "{1,3}", "{}"], "answer": 1, "hints": ["Union combines all unique elements.", "The shared 2 appears once.", "So all three unique values remain."], "id": 24}, {"type": "mcq", "topic": "Set Operations", "level": "Intermediate", "q": "What is the intersection?", "code": "a={1,2,3}\nb={2,3,4}\nprint(a & b)", "options": ["{1,4}", "{1,2,3,4}", "{2,3}", "{}"], "answer": 2, "hints": ["Intersection keeps common elements.", "2 and 3 occur in both sets.", "1 and 4 occur in only one set."], "id": 25}, {"type": "mcq", "topic": "Set Operations", "level": "Intermediate", "q": "What is printed?", "code": "a={1,2,3}\nb={2,3,4}\nprint(a-b)", "options": ["{2,3}", "{1}", "{4}", "{1,4}"], "answer": 1, "hints": ["a-b keeps elements in a but not b.", "2 and 3 are also in b.", "Only 1 remains."], "id": 26}, {"type": "mcq", "topic": "Set Operations", "level": "Intermediate", "q": "What does symmetric difference keep?", "code": "a={1,2,3}\nb={2,3,4}", "options": ["Only common elements", "All elements including duplicates", "Elements in either set but not both", "Only elements of a"], "answer": 2, "hints": ["Symmetric difference excludes the intersection.", "1 and 4 are unique to one side.", "The operator is ^."], "id": 27}, {"type": "code", "topic": "Set Operations", "level": "Interview", "q": "Find common elements between two lists using sets.", "code": "a=[1,2,3,4]\nb=[3,4,5,6]\n# Write your solution here", "expected": "Use set(a) & set(b).", "hints": ["Convert both lists to sets.", "Use intersection.", "The result contains values common to both."], "id": 28}, {"type": "code", "topic": "Set Operations", "level": "Interview", "q": "Find elements that occur in the first list but not the second.", "code": "a=[1,2,3,4]\nb=[3,4,5]\n# Write your solution here", "expected": "Use set(a) - set(b).", "hints": ["Convert both lists to sets.", "Use set difference.", "Keep only elements unique to the first collection."], "id": 29}, {"type": "mcq", "topic": "Set Methods", "level": "Beginner", "q": "What does s.add(5) do?", "code": "s={1,2}\ns.add(5)", "options": ["Adds 5", "Removes 5", "Returns a sorted set", "Clears the set"], "answer": 0, "hints": ["add inserts one element.", "The set changes in place.", "It does not return a new sorted set."], "id": 30}, {"type": "mcq", "topic": "Set Methods", "level": "Intermediate", "q": "Difference between remove() and discard()?", "code": "s={1,2}\ns.discard(5)", "options": ["Both always raise KeyError", "discard ignores a missing element", "remove ignores a missing element", "Both clear the set"], "answer": 1, "hints": ["The question uses a missing element.", "discard is designed to avoid an error in that case.", "remove would raise KeyError."], "id": 31}, {"type": "code", "topic": "Set Methods", "level": "Intermediate", "q": "Add all values from a list to an existing set.", "code": "s={1,2}\nvalues=[2,3,4]\n# Write your solution here", "expected": "Use s.update(values).", "hints": ["add() is for one element.", "update() can add multiple elements from an iterable.", "Duplicates are automatically handled."], "id": 32}, {"type": "mcq", "topic": "Set Methods", "level": "Interview", "q": "What does s.pop() do?", "code": "s={10,20,30}", "options": ["Always removes the smallest element", "Removes and returns an arbitrary set element", "Removes all elements", "Returns the length"], "answer": 1, "hints": ["Sets are unordered collections.", "pop() removes an arbitrary element.", "It also returns that removed element."], "id": 33}, {"type": "code", "topic": "Sets + Lists + Strings", "level": "Beginner", "q": "Remove duplicate numbers from a list while using a set.", "code": "nums=[1,2,2,3,3,4]\n# Write your solution here", "expected": "Use list(set(nums)) if ordering is not required.", "hints": ["A set removes duplicates.", "Convert the list to a set.", "Convert back to list if the output must be a list."], "id": 34}, {"type": "code", "topic": "Sets + Lists + Strings", "level": "Intermediate", "q": "Find all unique characters in a string.", "code": "s='banana'\n# Write your solution here", "expected": "Use set(s).", "hints": ["Strings are iterable.", "set() keeps one copy of each character.", "Print or assign the resulting set."], "id": 35}, {"type": "mcq", "topic": "Sets + Lists + Strings", "level": "Intermediate", "q": "What is len(set('banana'))?", "code": "", "options": ["3", "6", "4", "2"], "answer": 0, "hints": ["Unique characters are b, a and n.", "Repeated a and n are removed.", "There are three unique characters."], "id": 36}, {"type": "code", "topic": "Sets + Lists + Strings", "level": "Interview", "q": "Find characters that appear in both strings.", "code": "a='python'\nb='typhoon'\n# Write your solution here", "expected": "Use set(a) & set(b).", "hints": ["Convert each string to a set of unique characters.", "Use intersection.", "Duplicates are irrelevant for this question."], "id": 37}, {"type": "code", "topic": "Sets + Lists + Strings", "level": "Interview", "q": "Check whether two lists have , "code": "s={[1,2]}", "options": ["Yes", "No, lists are unhashable", "Only when empty", "Only with integers"], "answer": 1, "hints": ["Set elements must be hashable.", "Lists are mutable.", "Mutable lists are unhashable."], "id": 43}, {"type": "code", "topic": "Advanced Interview Problems", "level": "Advanced", "q": "Find the duplicate values in a list using sets.", "code": "nums=[1,2,3,2,4,3,5,1]\n# Write your solution here", "expected": "Track seen values and add values already seen to a duplicates set.", "hints": ["Create seen=set() and duplicates=set().", "If a value is already in seen, add it to duplicates.", "Otherwise add it to seen."], "id": 44}, {"type": "code", "topic": "Advanced Interview Problems", "level": "Advanced", "q": "Find the first repeated element in a list.", "code": "nums=[5,3,1,4,3,5]\n# Write your solution here", "expected": "Scan left-to-right with a seen set; return the first item already in seen.", "hints": ["Order matters here, so do not rely only on set(nums).", "Use a seen set.", "The first repeated value is the one encountered twice first."], "id": 45}, {"type": "code", "topic": "Advanced Interview Problems", "level": "Advanced", "q": "Determine whether two strings are anagrams using sets and another appropriate check.", "code": "a='listen'\nb='silent'\n# Write your solution here", "expected": "For general anagrams, compare sorted(a) == sorted(b), or frequency dictionaries. Sets alone are insufficient when repeated characters matter.", "hints": ["Sets ignore duplicate counts.", "Anagram logic must preserve character frequencies.", "sorted strings or frequency dictionaries are safer."], "id": 46}, {"type": "code", "topic": "Advanced Interview Problems", "level": "Advanced", "q": "Find values that occur in all three lists.", "code": "a=[1,2,3,4]\nb=[2,3,4,5]\nc=[0,2,3,6]\n# Write your solution here", "expected": "Use set(a) & set(b) & set(c).", "hints": ["Convert all three lists to sets.", "Intersection can be chained.", "Keep only val ": "Tuple Unpacking", "type": "mcq", "topic": "nested unpacking", "level": "Advanced", "question": "What is printed?", "code": "(a, b), c = (1, 2), 3\nprint(a, b, c)", "options": ["1 2 3", "(1, 2) 3", "Error", "1 (2, 3)"], "answer": 0, "hints": ["The left side has a nested pattern (a, b) matching the tuple (1, 2).", "a unpacks to 1 and b unpacks to 2.", "c takes the remaining value, 3, giving '1 2 3'."]}, {"topicName": "Sets Basics", "type": "mcq", "topic": "set + duplicates", "level": "Beginner", "question": "What is printed?", "code": "s = {1, 2, 2, 3}\nprint(len(s))", "options": ["2", "3", "4", "Error"], "answer": 1, "hints": ["Sets automatically remove duplicate values.", "The unique values are 1, 2 and 3.", "The result is 3."]}, {"topicName": "Sets Basics", "type": "mcq", "topic": "membership", "level": "Intermediate", "question": "What is printed?", "code": "s = {1, 2, 3}\nprint(4 in s)", "options": ["True", "False", "Error", "None"], "answer": 1, "hints": ["in checks whether a value exists in the set.", "4 is not one of the set's elements.", "The result is False."]}, {"topicName": "Sets Basics", "type": "mcq", "topic": "set() from string", "level": "Advanced", "question": "What is printed?", "code": "print(len(set('aab')))", "options": ["2", "3", "1", "Error"], "answer": 0, "hints": ["set() on a string keeps only unique characters.", "'aab' has the unique characters 'a' and 'b'.", "len() of that set is 2."]}, {"topicName": "Set Operations", "type": "mcq", "topic": "intersection", "level": "Beginner", "question": "What is printed?", "code": "a = {1, 2, 3}\nb = {2, 3, 4}\nprint(a & b)", "options": ["{2, 3}", "{1, 2, 3, 4}", "{1}", "Error"], "answer": 0, "hints": ["& computes the intersection of two sets.", "The intersection keeps only elements found in both sets.", "Both sets share 2 and 3."]}, {"topicName": "Set Operations", "type": "mcq", "topic": "union", "level": "Intermediate", "question": "What is printed?", "code": "a = {1, 2, 3}\nb = {2, 3, 4}\nprint(a ts": ["set() removes duplicate values from the list.", "The unique values are 1, 2 and 3.", "len() of that set is 3."]}, {"topicName": "Sets + Lists + Strings", "type": "mcq", "topic": "dedupe a list", "level": "Intermediate", "question": "Which expression removes duplicates from a list (order not preserved)?", "code": "nums = [3, 1, 2, 1, 3]", "options": ["list(set(nums))", "nums.unique()", "nums.dedupe()", "sorted(nums)"], "answer": 0, "hints": ["A set automatically discards duplicate values.", "Converting back to a list gives the unique values.", "list(set(nums)) removes duplicates, though the original order isn't preserved."]}, {"topicName": "Sets + Lists + Strings", "type": "mcq", "topic": "unique characters", "level": "Advanced", "question": "What is printed?", "code": "text = 'mississippi'\nprint(len(set(text)))", "options": ["4", "11", "9", "Error"], "answer": 0, "hints": ["set(text) keeps only the unique characters.", "The unique letters in 'mississippi' are m, i, s and p.", "That's 4 unique characters."]}, {"topicName": "Tuples + Sets + Dictionaries", "type": "mcq", "topic": "tuple as dict key", "level": "Beginner", "question": "What is printed?", "code": "d = {(1, 2): 'a'}\nprint(d[(1, 2)])", "options": ["'a'", "(1, 2)", "Raises KeyError", "Raises TypeError"], "answer": 0, "hints": ["Tuples are immutable and hashable, so they can be dictionary keys.", "(1, 2) is a valid key in this dict.", "Its value is 'a'."]}, {"topicName": "Tuples + Sets + Dictionaries", "type": "mcq", "topic": "unhashable key", "level": "Intermediate", "question": "Which of these CANNOT be used as a dictionary key?", "code": "", "options": ["A tuple", "A string", "A list", "An integer"], "answer": 2, "hints": ["Dictionary keys must be hashable.", "Hashable objects are generally immutable.", "Lists are mutable and therefore unhashable, so they cannot be keys."]}, {"topicName": "Tuples + Sets + Dictionaries", "type": "mcq", "topic": "unhashable set element", "level": "Advanced", "question": "Which of these CANNOT be added to a set?", "code": "", "options": ["A tuple of numbers", "A string", "A list", "An integer"], "answer": 2, "hints": ["Set elements, like dictionary keys, must be hashable.", "Lists are mutable and therefore unhashable.", "Attempting s.add([1, 2]) raises TypeError."]}, {"topicName": "Advanced Interview Problems", "type": "mcq", "topic": "common elements via sets", "level": "Advanced", "question": "Which correctly finds the common elements between two lists?", "code": "a = [1, 2, 3]\nb = [2, 3, 4]", "options": ["set(a) & set(b)", "a & b", "a.intersection(b)", "set(a) + set(b)"], "answer": 0, "hints": ["Lists don't directly support the & operator.", "Convert both lists to sets first.", "set(a) & set(b) then gives the intersection."]}, {"topicName": "Advanced Interview Problems", "type": "mcq", "topic": "same unique elements", "level": "Advanced", "question": "Which correctly checks whether two lists contain exactly the same unique elements, regardless of order?", "code": "a = [1, 2, 3]\nb = [3, 2, 1]", "options": ["set(a) == set(b)", "a == b", "sorted(a) is sorted(b)", "a.count() == b.count()"], "answer": 0, "hints": ["Order shouldn't matter, and duplicates shouldn't matter either.", "Converting both lists to sets ignores order and duplicates.", "set(a) == set(b) compares just the unique elements."]}, {"topicName": "Advanced Interview Problems", "type": "mcq", "topic": "why tuples as keys", "level": "Interview", "question": "Why are tuples often preferred over lists as dictionary keys?", "code": "", "options": ["Tuples are immutable and hashable, unlike lists", "Tuples are always shorter", "Lists cannot store numbers", "Dictionaries only accept tuples"], "answer": 0, "hints": ["Dictionary keys must be hashable.", "Hashability generally requires immutability.", "Tuples are immutable and hashable; lists are mutable and are not."]}]};let attempts={},solved={},score=0;

function practice(){attempts={};solved={};score=0;app.innerHTML=`<button class="secondary" onclick="home()">← Home</button><div class="card"><h2>🎯 100 Tuples & Sets Questions</h2><p>Wrong MCQs reveal hints instead of the direct answer. Coding questions provide guided self-check information.</p><div class="stats"><div class="stat" id="score">Score: 0 / 0</div><div class="stat">100 Questions</div></div></div><div id="questions"></div>`;DATA.questions.forEach(makeQuestion)}
