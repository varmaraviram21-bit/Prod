t__ Constructor", "level": "Intermediate", "q": "Create an Employee class with name='Unknown' as a default constructor argument.", "code": "# Write your solution here", "expected": "Use def __init__(self,name='Unknown'): self.name=name.", "hints": ["Defaults work like normal function parameters.", "self is still the first parameter.", "Store the selected name."], "id": 14}, {"type": "mcq", "topic": "__init__ Constructor", "level": "Interview", "q": "Which statement is true?", "code": "", "options": ["__init__ creates the class", "__init__ initializes an already-created instance", "__init__ must return self", "__init__ can return any value"], "answer": 1, "hints": ["The class exists before instances are made.", "Initialization happens for an instance.", "A normal __init__ must return None."], "id": 15}, {"type": "mcq", "topic": "Instance Variables & Methods", "level": "Beginner", "q": "Which attribute is normally specific to each object?", "code": "class Dog:\n    def __init__(self,name): self.name=name", "options": ["self.name", "Dog", "__init__", "class"], "answer": 0, "hints": ["self attributes belong to an instance.", "Two Dog objects can have different names.", "Class attributes are shared differently."], "id": 16}, {"type": "code", "topic": "Instance Variables & Methods", "level": "Beginner", "q": "Create a BankAccount with balance initialized to 0 and a deposit(amount) method that adds to balance.", "code": "# Write your solution here", "expected": "Use self.balance=0 and self.balance += amount.", "hints": ["Initialize balance in __init__.", "deposit receives self and amount.", "Modify the instance attribute."], "id": 17}, {"type": "mcq", "topic": "Instance Variables & Methods", "level": "Beginner", "q": "What is printed?", "code": "class Counter:\n    def __init__(self): self.n=0\n    def inc(self): self.n+=1\nc=Counter(); c.inc(); c.inc(); print(c.n)", "options": ["0", "1", "2", "Error"], "answer": 2, "hints": ["n starts at zero.", "Each inc call adds one.", "There are two calls."], "id": 18}, {"type": "code", "topic": "Instance Variables & Methods", "level": "Intermediate", "q": "Write a Rectangle class with area() returning self.width*self.height.", "code": "# Write your solution here", "expected": "Define __init__(self,width,height) and area(self) returning the product.", "hints": ["Store width and height on self.", "area needs only self.", "Multiply the two attributes."], "id": 19}, {"type": "mcq", "topic": "Instance Variables & Methods", "level": "Interview", "q": "Why is self required in an instance method definition?", "code": "", "options": ["It represents the current instance and gives access to its state", "It makes the method static", "It imports the class", "It is optional syntax"], "answer": 0, "hints": ["The method needs a reference to the object.", "Python passes the instance when called through an object.", "The conventional name is self."], "id": 20}, {"type": "code", "topic": "Instance Variables & Methods", "level": "Intermediate", "q": "Create a Student class with marks and a method average() for three marks.", "code": "# Write your solution here", "expected": "Store three marks and return their sum divided by 3.", "hints": ["Store the marks as instance attributes.", "Use (a+b+c)/3.", "Return the calculated value."], "id": 21}, {"type": "mcq", "topic": "Class Variables & Class Methods", "level": "Intermediate", "q": "Where is a class variable normally defined?", "code": "class Employee:\n    company='ABC'", "options": ["Inside every method only", "Directly in the class body", "Only inside __init__", "In a loop"], "answer": 1, "hints": ["company is aligned with the class body.", "It is not prefixed with self.", "Instances can access it unless shadowed."], "id": 22}, {"type": "mcq", "topic": "Class Variables & Class Methods", "level": "Intermediate", "q": "What is printed?", "code": "class A:\n    count=0\nx=A(); y=A()\nprint(x.count, y.count)", "options": ["0 0", "1 1", "None None", "Error"], "answer" : 37}, {"type": "code", "topic": "Encapsulation", "level": "Advanced", "q": "Create a BankAccount with __balance and deposit/withdraw methods that prevent withdrawal if amount exceeds balance.", "code": "# Write your solution here", "expected": "Check if amount <= self.__balance before subtracting.", "hints": ["Keep balance behind __balance.", "Use a condition before changing it.", "Only subtract when sufficient funds exist."], "id": 38}, {"type": "mcq", "topic": "Inheritance", "level": "Intermediate", "q": "What is inheritance used for?", "code": "", "options": ["Creating unrelated variables", "Reusing and extending behavior from a parent class", "Replacing all functions", "Only storing data"], "answer": 1, "hints": ["A child class can inherit methods and attributes.", "It can also override behavior.", "This supports code reuse and specialization."], "id": 39}, {"type": "code", "topic": "Inheritance", "level": "Intermediate", "q": "Create Animal with speak() and Dog(Animal) that inherits it.", "code": "# Write your solution here", "expected": "Define class Dog(Animal): pass after defining Animal.", "hints": ["Define the parent first.", "Put the parent name in parentheses.", "pass is enough for inheritance here."], "id": 40}, {"type": "mcq", "topic": "Inheritance", "level": "Intermediate", "q": "What does super() commonly help you do?", "code": "", "options": ["Access parent-class behavior", "Create a global variable", "Make a method static", "Stop inheritance"], "answer": 0, "hints": ["super() provides a proxy for parent/superclass access.", "It is often used to call a parent's __init__.", "It is especially useful in inheritance chains."], "id": 41}, {"type": "code", "topic": "Inheritance", "level": "Intermediate", "q": "Create Vehicle with __init__(brand), then Car(Vehicle) with an extra model attribute and use super().__init__.", "code": "# Write your solution here", "expected": "Car.__init__ should call super().__init__(brand) and set self.model=model.", "hints" ithout self, there's no reference to any particular instance.", "So they cannot directly access instance attributes."]}, {"topicName": "Encapsulation", "type": "mcq", "topic": "single underscore convention", "level": "Beginner", "question": "What is printed?", "code": "class A:\n    def __init__(self):\n        self._x = 1\nprint(A()._x)", "options": ["1", "Raises AttributeError", "None", "Error"], "answer": 0, "hints": ["A single leading underscore is just a naming convention.", "It signals 'internal use' but doesn't enforce access restrictions.", "A()._x is still directly accessible and prints 1."]}, {"topicName": "Encapsulation", "type": "mcq", "topic": "name mangling", "level": "Intermediate", "question": "What happens?", "code": "class A:\n    def __init__(self):\n        self.__x = 1\na = A()\nprint(a.__x)", "options": ["Prints 1", "Raises AttributeError", "Prints None", "Raises TypeError"], "answer": 1, "hints": ["A double leading underscore triggers name mangling.", "The attribute is actually stored as _A__x, not __x.", "Accessing a.__x directly raises AttributeError."]}, {"topicName": "Encapsulation", "type": "mcq", "topic": "accessing mangled names", "level": "Advanced", "question": "What is printed?", "code": "class A:\n    def __init__(self):\n        self.__x = 1\na = A()\nprint(a._A__x)", "options": ["1", "Raises AttributeError", "None", "Error"], "answer": 0, "hints": ["Name mangling renames __x to _A__x internally.", "That mangled name can still be accessed directly, though it's discouraged.", "a._A__x prints 1."]}, {"topicName": "Inheritance", "type": "mcq", "topic": "inherited method", "level": "Beginner", "question": "What is printed?", "code": "class Animal:\n    def speak(self):\n        return 'generic sound'\nclass Dog(Animal):\n    pass\nprint(Dog().speak())", "options": ["'generic sound'", "generic sound", "Error", "None"], "answer": 1, "hints": ["Dog inherits speak() from Animal since it doesn't define its own.", "Calling Dog().speak() runs tions": ["meow woof", "woof meow", "Error", "None None"], "answer": 0, "hints": ["The loop calls speak() on each object without checking its exact class.", "Cat's speak() runs first, then Dog's.", "The output is 'meow woof '."]}, {"topicName": "Polymorphism", "type": "mcq", "topic": "built-in polymorphism", "level": "Advanced", "question": "What is printed?", "code": "print(len('abc'), len([1, 2, 3]))", "options": ["3 3", "'abc' [1, 2, 3]", "Error", "None None"], "answer": 0, "hints": ["len() works polymorphically across different types.", "It returns the character count for a string and the item count for a list.", "Both happen to be 3 here: '3 3'."]}, {"topicName": "Abstraction", "type": "mcq", "topic": "purpose of abstraction", "level": "Beginner", "question": "What is the purpose of abstraction in OOP?", "code": "", "options": ["Hide internal implementation details and expose only what's necessary", "Make all attributes public", "Prevent classes from having methods", "Remove the need for objects"], "answer": 0, "hints": ["Abstraction focuses on the 'what', not the 'how'.", "Users interact with a simple interface, not the internal machinery.", "This matches option A."]}, {"topicName": "Abstraction", "type": "mcq", "topic": "abc module", "level": "Intermediate", "question": "Which module provides tools to create abstract base classes in Python?", "code": "", "options": ["abc", "collections", "functools", "itertools"], "answer": 0, "hints": ["Python has a dedicated module for abstract base classes.", "It provides ABC and the abstractmethod decorator.", "That module is abc."]}, {"topicName": "Abstraction", "type": "mcq", "topic": "instantiating abstract classes", "level": "Advanced", "question": "What happens?", "code": "from abc import ABC, abstractmethod\nclass Shape(ABC):\n    @abstractmethod\n    def area(self):\n        pass\ns = Shape()", "options": ["s is created normally", "Raises TypeError", "Raises AttributeError", "Nothing happens"], "answer": 1, "hints": ["Shape has at least one unimplemented abstract method.", "Python prevents instantiating classes with unimplemented abstract methods.", "This raises TypeError: Can't instantiate abstract class Shape with abstract method area."]}, {"topicName": "Advanced OOP Interview", "type": "mcq", "topic": "__str__", "level": "Advanced", "question": "Which special method controls how an object is displayed when passed to print()?", "code": "", "options": ["__str__", "__init__", "__len__", "__call__"], "answer": 0, "hints": ["print() converts its argument to a string for display.", "A class can customize that conversion.", "The special method used is __str__."]}, {"topicName": "Advanced OOP Interview", "type": "mcq", "topic": "__eq__", "level": "Advanced", "question": "Which special method allows two custom objects to be compared using ==?", "code": "", "options": ["__eq__", "__cmp__", "__equals__", "__compare__"], "answer": 0, "hints": ["Python delegates == to a specific dunder method.", "Defining it lets you control what 'equal' means for your class.", "That method is __eq__."]}, {"topicName": "Advanced OOP Interview", "type": "mcq", "topic": "MRO", "level": "Interview", "question": "What is Method Resolution Order (MRO) used for?", "code": "", "options": ["Determining the order base classes are searched when looking up a method", "Sorting instance attributes alphabetically", "Deciding which class variables are private", "Choosing the return type of a method"], "answer": 0, "hints": ["This matters most with multiple inheritance.", "Several parent classes might define the same method name.", "MRO defines the precise order Python searches through those classes."]}]};let attempts={},solved={},score=0;
function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function home(){app.innerHTML=`<div class="card"><h2>📚 Python OOP — Version 8</h2><p>Learn the concept first, then solve interview-style OOP problems from beginner to advanced.</p></div><div class="grid"><div class="card click" onclick="learn()"><span class="badge">10 topics</span><h2>📖 Learn</h2><p>Definition → use case → example → interview focus.</p></div><div class="card click" onclick="practice()"><span class="badge">100 questions</span><h2>🎯 Practice</h2><p>Immediate feedback, hints and code-writing challenges.</p></div></div>`}
function learn(){let x='<button class="secondary" onclick="home()">← Home</button><div class="card"><h2>📖 OOP Topics</h2><p>Start with the definition and use case before practicing each topic.</p></div><div class="grid">';DATA.topics.forEach((t,i)=>x+=`<div class="card click" onclick="topic(${i})"><span class="badge">${esc(t[1])}</span><h3>${esc(t[0])}</h3><p>${esc(t[2])}</p></div>`);x+='</div>';app.innerHTML=x}
function topic(i){let t=DATA.topics[i],e=INFO[t[0]];app.innerHTML=`<button class="secondary" onclick="learn()">← Topics</button><div class="card"><span class="badge">${esc(t[1])}</span><h2>${esc(t[0])}</h2><h3 class="section">Definition</h3><p>${esc(e[0])}</p><h3 class="section">Use case</h3><p>${esc(e[1])}</p><h3 class="section">Example</h3><pre>${esc(e[2])}</pre><h3 class="section">Interview focus</h3><p>Be ready to explain syntax, object behavior, edge cases, relationships between classes, and Python-specific OOP behavior.</p><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="primary" onclick="practice()">Practice (all 100)</button><button class="primary" onclick="practiceTopic(i)">Practice this topic only</button></div></div>`}
function practice(){solved={};attempts={};score=0;app.innerHTML=`<button class="secondary" onclick="home()">← Home</button><div class="card"><h2>🎯 100 OOP Questions</h2><p>Wrong MCQs show hints instead of the direct answer. Coding questions provide guided self-check hints.</p><div class="stats"><div class="stat" id="score">Score: 0 / 0</div><div class="stat">100 Questions</div></div></div><div id="questions"></div>`;DATA.questions.forEach(makeQuestion)}
function makeQuestion(q){let d=document.createElement('div');d.className='question';d.id='q'+q.id;let controls=q.type==='mcq'?q.options.map((o,j)=>`<label class="opt" data-o="${j}"><input type="radio" name="q${q.id}" onchange="answer(${q.id},${j})"><span><b>${'ABCD'[j]}.</b> ${esc(o)}</span></label>`).join(''):`<textarea id="code${q.id}" placeholder="Write your Python solution here..."></textarea><button class="primary" onclick="submitCode(${q.id})">Check Code</button><div class="result" id="result${q.id}"></div>`;d.innerHTML=`<span class="badge">${esc(q.topic)} • ${esc(q.level)}</span><h3>${q.id}. ${esc(q.q)}</h3>${q.code?'<pre>'+esc(q.code)+'</pre>':''}${controls}<div id="fb${q.id}"></div><div id="hint${q.id}" class="hint" style="display:none"></div>`;questions.appendChild(d)}
function answer(id,c){let q=DATA.questions.find(x=>x.id===id);if(solved[id])return;attempts[id]=(attempts[id]||0)+1;let d=document.getElementById('q'+id),fb=document.getElementById('fb'+id),h=document.getElementById('hint'+id);d.querySelectorAll('.opt').forEach(x=>x.classList.remove('correct','wrong'));d.querySelector(`[data-o="${c}"]`).classList.add(c===q.answer?'correct':'wrong');if(c===q.answer){solved[id]=1;score++;fb.innerHTML='<p class="ok">✓ Correct!</p>';h.style.display='none'}else{fb.innerHTML='<p class="no">✗ Wrong — the direct answer is hidden.</p>';h.style.display='block';h.innerHTML='<b>💡 Hint '+Math.min(attempts[id],q.hints.length)+'</b><br>'+esc(q.hints[Math.min(attempts[id],q.hints.length)-1])}updateScore()}
function submitCode(id){let v=document.getElementById('code'+id).value.trim(),q=DATA.questions.find(x=>x.id===id),r=document.getElementById('result'+id);if(!v){r.textContent='Please enter your code first.';return}if(!solved[id]){solved[id]=1;score++}r.innerHTML='<b>Submitted.</b> Self-check hints: '+esc(q.hints.join(' '));updateScore()}
function updateScore(){let done=Object.keys(solved).length;document.getElementById('score').textContent='Score: '+score+' / '+done}
const INFO={"Classes & Objects": ["A class is a blueprint that defines data and behavior; an object is an instance created from that class.", "Use classes when you want to model entities with related state and behavior.", "class Car:\n    pass\ncar = Car()"], "__init__ Constructor": ["__init__ is the initializer method that runs when an instance is initialized.", "Use it to establish the initial state of each object.", "class Person:\n    def __init__(self,name):\n        self.name=name"], "Instance Variables & Methods": ["Instance variables belong to individual objects; instance methods operate on an instance and normally receive self.", "Use them when each object needs its own state and behavior.", "class Dog:\n    def __init__(self,name): self.name=name\n    def bark(self): return 'Woof'"], "Class Variables & Class Methods": ["Class variables belong to the class and are commonly shared; class methods receive the class as cls.", "Use them for class-wide state and alternate constructors or class-level operations.", "class A:\n    count=0\n    @classmethod\n    def make(cls): return cls()"], "Static Methods": ["A static method is a method with no implicit self or cls argument.", "Use it for utility logic logically grouped with a class but independent of object/class state.", "class Math:\n    @staticmethod\n    def add(a,b): return a+b"], "Encapsulation": ["Encapsulation groups state and behavior and controls how state is exposed; Python uses conventions and name mangling rather than strict private access.", "Use properties/methods to validate or control access to internal state.", "class A:\n    def __init__(self): self.__x=10"], "Inheritance": ["Inheritance lets a child class reuse and specialize behavior from a parent class.", "Use it for genuine is-a relationships and shared interfaces/behavior.", "class Dog(Animal):\n    pass"], "Polymorphism": ["Polymorphism lets different objects be used through a common interface even when implementations differ.", "Use it to write flexible code that depends on behavior rather than concrete type.", "for shape in shapes:\n    print(shape.area())"], "Abstraction": ["Abstraction exposes an interface while hiding implementation details; Python supports abstract base classes through abc.", "Use it when subclasses must provide required operations.", "from abc import ABC, abstractmethod\nclass Shape(ABC):\n    @abstractmethod\n    def area(self): pass"], "Advanced OOP Interview": ["Advanced OOP combines inheritance, composition, polymorphism, properties, special methods, MRO and design choices.", "Interviewers often test behavior, trade-offs, object relationships and Python-specific details.", "class Point:\n    def __str__(self): return 'Point(...)'"]};
const LEVEL_ORDER={"Beginner":0,"Intermediate":1,"Advanced":2,"Interview":3};
let topicAttempts={},topicSolved={},topicScore=0,currentTopicSet=[];
function practiceTopic(i){
  const t=DATA.topics[i];
  currentTopicSet=DATA.topicQuestions.filter(q=>q.topicName===t[0]).sort((a,b)=>LEVEL_ORDER[a.level]-LEVEL_ORDER[b.level]);
  topicAttempts={};topicSolved={};topicScore=0;
  app.innerHTML=`<button class="secondary" onclick="topic(${i})">\u2190 ${esc(t[0])}</button><div class="card"><h2>\U0001f3af ${esc(t[0])} \u2014 Practice</h2><p>Unique basic-to-advanced questions for this topic only (separate from the main 100-question bank).</p><div class="stats"><div class="stat" id="tscore">Score: 0 / 0</div><div class="stat">${currentTopicSet.length} Questions</div></div></div><div id="tquestions"></div>`;
  currentTopicSet.forEach((q,idx)=>makeTopicQuestion(q,idx));
}
function makeTopicQuestion(q,idx){let d=document.createElement('div');d.className='question';d.id='tq'+idx;let controls=q.type==='mcq'?q.options.map((o,j)=>`<label class="opt" data-o="${j}"><input type="radio" name="tq${idx}" onchange="topicAnswer(${idx},${j})"><span><b>${'ABCD'[j]}.</b> ${esc(o)}</span></label>`).join(''):`<textarea id="tcode${idx}" placeholder="Write your Python solution here..."></textarea><button class="primary" onclick="topicSubmitCode(${idx})">Check Code</button><div class="result" id="tresult${idx}"></div>`;d.innerHTML=`<span class="badge">${esc(q.topic)} \u2022 ${esc(q.level)}</span><h3>${idx+1}. ${esc(q.question)}</h3>${q.code?`<pre>${esc(q.code)}</pre>`:''}${controls}<div id="tfb${idx}"></div><div id="thint${idx}" class="hint" style="display:none"></div>`;tquestions.appendChild(d)}
function topicAnswer(idx,choice){let q=currentTopicSet[idx];if(topicSolved[idx])return;topicAttempts[idx]=(topicAttempts[idx]||0)+1;let n=topicAttempts[idx],d=document.getElementById('tq'+idx),fb=document.getElementById('tfb'+idx),h=document.getElementById('thint'+idx);d.querySelectorAll('.opt').forEach(x=>x.classList.remove('correct','wrong'));d.querySelector(`[data-o="${choice}"]`).classList.add(choice===q.answer?'correct':'wrong');if(choice===q.answer){topicSolved[idx]=1;topicScore++;fb.innerHTML='<p class="ok">\u2713 Correct!</p>';h.style.display='none'}else{fb.innerHTML='<p class="no">\u2717 Wrong \u2014 answer hidden.</p>';h.style.display='block';h.innerHTML='<b>\U0001f4a1 Hint '+Math.min(n,q.hints.length)+'</b><br>'+esc(q.hints[Math.min(n,q.hints.length)-1])}updateTopicScore()}
function topicSubmitCode(idx){let v=document.getElementById('tcode'+idx).value.trim(),q=currentTopicSet[idx],r=document.getElementById('tresult'+idx);if(!v){r.textContent='Please enter your code first.';return}if(!topicSolved[idx]){topicSolved[idx]=1;topicScore++}r.innerHTML='<b>Submitted.</b> Self-check approach: '+esc(q.hints.join(' '));updateTopicScore()}
function updateTopicScore(){let done=Object.keys(topicSolved).length;document.getElementById('tscore').textContent='Score: '+topicScore+' / '+done}
home();
</script></body></html>
