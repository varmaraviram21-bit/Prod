<!DOCTYPE html>
<html>

<head>

    <title>Login</title>

    <style>

        body {
            font-family: Arial;
            background: #f2f2f2;

            display: flex;
            justify-content: center;
            align-items: center;

            height: 100vh;
        }

        .container {
            background: white;

            padding: 30px;

            width: 350px;

            border-radius: 10px;

            box-shadow: 0 0 10px #ccc;
        }

        h2 {
            text-align: center;
        }

        input {
            width: 100%;

            padding: 10px;

            margin: 8px 0;

            box-sizing: border-box;
        }

        button {
            width: 100%;

            padding: 10px;

            background: #333;

            color: white;

            border: none;

            cursor: pointer;
        }

        #message {
            text-align: center;

            margin-top: 15px;
        }

    </style>

</head>


<body>


<div class="container">

    <h2>Login</h2>


    <form id="loginForm">

        <input
            type="email"
            id="email"
            placeholder="Email"
            required
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>


    <p id="message"></p>


    <p>

        Don't have an account?

        <a href="/signup">
            Sign Up
        </a>

    </p>

</div>


<script>

document
    .getElementById("loginForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();


        const email =
            document.getElementById("email").value;

        const password =
            document.getElementById("password").value;


        const response = await fetch("/api/login", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({

                email: email,
                password: password

            })

        });


        const data = await response.json();


        document.getElementById("message").innerText =
            data.message;


        if (data.success) {

            window.location.href = "/index";
        }
        else {
            setTimeout(function() {
                window.location.href = "/signup";
            }, 60);
        }

    });

</script>


</body>

</html>
