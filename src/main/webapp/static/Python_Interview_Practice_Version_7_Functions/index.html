const DATA={"version": "7.0", "title": "Python Interview Practice — Functions", "topics": [["Function Basics", "Beginner", "Define and call functions; understand why functions are used."], ["Parameters & Arguments", "Beginner", "Positional, keyword, default and mixed arguments."], ["Return Values", "Beginner", "return vs print, multiple returns and using results."], ["Scope & Lifetime", "Intermediate", "Local/global scope, name resolution and mutation."], ["Default & Keyword Arguments", "Intermediate", "Defaults, keyword calls and common interview traps."], ["*args & **kwargs", "Intermediate", "Variable-length positional and keyword arguments."], ["Lambda Functions", "Intermediate", "Small anonymous functions and use with built-ins."], ["Functions + Built-ins", "Interview", "Combine functions with map, filter, sorted, zip, enumerate and others."], ["Recursion", "Advanced", "Base cases, recursive calls and classic interview problems."], ["Higher-Order Functions", "Advanced", "Functions as values, callbacks and closures."], ["Advanced Interview Problems", "Advanced", "Closures, decorators, recursion, scope and function design."]], "questions": [{"type": "mcq", "topic": "Function Basics", "level": "Beginner", "q": "Which keyword is used to define a function?", "code": "", "options": ["function", "def", "define", "fun"], "answer": 1, "hints": ["Python uses a dedicated keyword for function definitions.", "The keyword is three letters.", "It starts a function definition."], "id": 1}, {"type": "mcq", "topic": "Function Basics", "level": "Beginner", "q": "What is printed?", "code": "def greet():\n    print('Hello')\ngreet()", "options": ["Nothing", "Hello", "greet", "Error"], "answer": 1, "hints": ["The function is defined first.", "The last line calls it.", "The print statement runs during the call."], "id": 2}, {"type": "code", "topic": "Function Basics", "level": "Beginner", "q": "Write a function named square that takes a number and prints its square.", "code": "# Write your solution here", "expected": "Define square(n) and use print(n ** 2) inside it.", "hints": ["Start with def square(n):", "The square operation is ** 2.", "This question asks you to print, not return."], "id": 3}, {"type": "mcq", "topic": "Function Basics", "level": "Beginner", "q": "What happens when a function definition is executed?", "code": "def add(a,b):\n    return a+b", "options": ["The function is called automatically", "A function object is created", "The result is printed", "The program stops"], "answer": 1, "hints": ["Defining a function does not execute its body.", "Python creates a callable function object.", "A call is required to execute the body."], "id": 4}, {"type": "mcq", "topic": "Function Basics", "level": "Beginner", "q": "Which is a valid function call?", "code": "def add(a,b):\n    return a+b", "options": ["call add(2,3)", "add 2,3", "add(2,3)", "add[2,3]"], "answer": 2, "hints": ["Function calls use parentheses.", "The arguments go inside the parentheses.", "The function name is add."], "id": 5}, {"type": "code", "topic": "Function Basics", "level": "Beginner", "q": "Create a function is_even(n) that returns True for even numbers and False otherwise.", "code": "# Write your solution here", "expected": "Use def is_even(n): and return n % 2 == 0.", "hints": ["Use modulo 2.", "The expression n % 2 == 0 is already boolean.", "Use return to send that boolean back."], "id": 6}, {"type": "mcq", "topic": "Function Basics", "level": "Beginner", "q": "What is the purpose of a function?", "code": "", "options": ["Only to print values", "To group reusable logic", "Only to store data", "To replace loops"], "answer": 1, "hints": ["Functions reduce repeated code.", "They package behavior into a reusable unit.", "Loops and functions solve different problems."], "id": 7}, {"type": "mcq", "topic": "Function Basics", "level": "Beginner", "q": "What is the output?", "code": "def f():\n    return 10\nprint(f() + 5)", "options": ["10", "15", "5", "None"], "answer": 1, "hints": ["f() returns a value.", "That value is used in an expression.", "10 + 5 is evaluated before print."], "id": 8}, {"type": "mcq", "topic": "Parameters & Arguments", "level": "Beginner", "q": "In def greet(name), what is name?", "code": "def greet(name):\n    print(name)", "options": ["Argument", "Parameter", "Return value", "Global variable"], "answer": 1, "hints": ["It appears in the function definition.", "A value supplied at the call is the argument.", "The definition names the parameter."], "id": 9}, {"type": "mcq", "topic": "Parameters & Arguments", "level": "Beginner", "q": "In greet('Ravi'), what is 'Ravi'?", "code": "def greet(name):\n    print(name)", "options": ["Parameter", "Argument", "Function", "Return value"], "answer": 1, "hints": ["It is supplied during the call.", "The function definition has name as the parameter.", "The supplied value is the argument."], "id": 10}, {"type": "mcq", "topic": "Parameters & Arguments", "level": "Beginner", "q": "What is printed?", "code": "def add(a,b):\n    return a+b\nprint(add(2,5))", "options": ["25", "7", "2", "5"], "answer": 1, "hints": ["The two arguments are 2 and 5.", "The function adds them.", "2 + 5 equals 7."], "id": 11}, {"type": "code", "topic": "Parameters & Arguments", "level": "Beginner", "q": "Write a function multiply(a,b) that returns the product.", "code": "# Write your solution here", "expected": "Use return a * b.", "hints": ["Create two parameters.", "Use multiplication.", "Return the result so the caller can use it."], "id": 12}, {"type": "mcq", "topic": "Parameters & Arguments", "level": "Intermediate", "q": "What is printed?", "code": "def show(a,b):\n    print(a,b)\nshow(b=20,a=10)", "options": ["10 20", "20 10", "Error", "None"], "answer": 0, "hints": ["Keyword arguments can be supplied by parameter name.", "Their order in the call does not have to match the definition.", "a receives 10 and b receives 20."], "id": 13}, {"type": "mcq", "topic": "Parameters & Arguments", "level": "Intermediate", "q": "Which call uses a keyword argument?", "code": "def power(base, exp):\n    return base ** exp", "options": ["power(2,3)", "power(base=2, exp=3)", "power[2,3]", "power 2,3"], "answer": 1, "hints": ["Keyword arguments use parameter_name=value.", "Both parameters are named in this option.", "Parentheses are still required."], "id": 14}, {"type": "code", "topic": "Parameters & Arguments", "level": "Intermediate", "q": "Write a function max_of_two(a,b) that returns the larger value without using max().", "code": "# Write your solution here", "expected": "Use an if/else comparison and return the larger value.", "hints": ["Compare a and b.", "Return a if a > b.", "Otherwise return b."], "id": 15}, {"type": "mcq", "topic": "Parameters & Arguments", "level": "Interview", "q": "What happens with this call?", "code": "def f(a,b):\n    return a+b\nf(1)", "options": ["Returns 1", "Returns None", "TypeError due to missing argument", "Uses b=0"], "answer": 2, "hints": ["Both required parameters need values.", "No default was supplied for b.", "Python raises TypeError when a required argument is missing."], "id": 16}, {"type": "mcq", "topic": "Return Values", "level": "Beginner", "q": "What is the difference between print() and return inside a function?", "code": "", "options": ["They are identical", "print displays; return sends a value to the caller", "return only displays text", "print stops the function"], "answer": 1, "hints": ["print produces output.", "return gives a value back to the calling code.", "A returned value can be stored or used in expressions."], "id": 17}, {"type": "mcq", "topic": "Return Values", "level": "Beginner", "q": "What is printed?", "code": "def f():\n    return 7\nx=f()\nprint(x)", "options": ["f", "7", "None", "Error"], "answer": 1, "hints": ["The returned value is assigned to x.", "x therefore contains 7.", "print(x) displays it."], "id": 18}, {"type": "mcq", "topic": "Return Values", "level": "Beginner", "q": "What does a function return if it reaches the end without return?", "code": "def f():\n    print('Hi')", "options": ["0", "False", "None", "Error"], "answer": 2, "hints": ["Python functions can finish without an explicit return.", "The implicit return value is None.", "The print inside the function is separate from its return value."], "id": 19}, {"type": "code", "topic": "Return Values", "level": "Beginner", "q": "Write a function sum_two(a,b) that returns the sum, then print the returned result.", "code": "# Write your solution here", "expected": "Define sum_two and use print(sum_two(…,…)).", "hints": ["Use return a + b.", "A returned value can be passed to print.", "Do not rely only on print inside the function."], "id": 20}, {"type": "mcq", "topic": "Return Values", "level": "Intermediate", "q": "What is printed?", "code": "def f():\n    return 1,2\nx=f()\nprint(type(x).__name__)", "options": ["list", "tuple", "int", "str"], "answer": 1, "hints": ["Multiple comma-separated return values are packed together.", "The packed object is immutable.", "Python represents it as a tuple."], "id": 21}, {"type": "code", "topic": "Return Values", "level": "Intermediate", "q": "Write a function divide(a,b) that returns both quotient and remainder.", "code": "# Write your solution here", "expected": "Return a // b, a % b.", "hints": ["Integer quotient uses //.", "Remainder uses %.", "Separate the two returned values with a comma."], "id": 22}, {"type": "mcq", "topic": "Return Values", "level": "Interview", "q": "What happens here?", "code": "def f():\n    return 10\n    print('Hello')\nf()", "options": ["Hello is printed", "10 is printed", "The print is unreachable", "SyntaxError"], "answer": 2, "hints": ["return exits the function immediately.", "Statements after return in the same execution path do not run.", "There is no syntax error merely because code follows return."], "id": 23}, {"type": "mcq", "topic": "Scope & Lifetime", "level": "Intermediate", "q": "Where is a variable created inside a function normally local?", "code": "def f():\n    x=10", "options": ["Inside the function", "Everywhere", "Only in imported modules", "Nowhere"], "answer": 0, "hints": ["Assignments inside a function create local names by default.", "Local scope belongs to that function call.", "Outside code cannot normally access that local name directly."], "id": 24}, {"type": "mcq", "topic": "Scope & Lifetime", "level": "Intermediate", "q": "What happens?", "code": "def f():\n    x=10\nf()\nprint(x)", "options": ["10", "None", "NameError", "0"], "answer": 2, "hints": ["x was local to f.", "The call ends and x is not a global name.", "Accessing it outside raises NameError."], "id": 25}, {"type": "mcq", "topic": "Scope & Lifetime", "level": "Intermediate", "q": "Which keyword lets a function assign to a module-level global variable?", "code": "x=10\n\ndef f():\n    # here", "options": ["outer", "global", "public", "module"], "answer": 1, "hints": ["Python has a keyword for explicitly referring to the global binding.", "It is used before assignment to that name.", "The keyword is global."], "id": 26}, {"type": "code", "topic": "Scope & Lifetime", "level": "Intermediate", "q": "Create a global count=0 and a function increment() that uses global to increase it by 1.", "code": "# Write your solution here", "expected": "Use count=0, then inside increment use global count and count += 1.", "hints": ["Assignment normally creates a local name inside a function.", "Use global count before modifying the global binding.", "Then increment with += 1."], "id": 27}, {"type": "mcq", "topic": "Scope & Lifetime", "level": "Interview", "q": "What is printed?", "code": "x=10\ndef f():\n    x=20\n    return x\nprint(f(), x)", "options": ["20 20", "10 10", "20 10", "10 20"], "answer": 2, "hints": ["The local x shadows the global x inside f.", "f() returns its local value.", "The global x remains 10."], "id": 28}, {"type": "mcq", "topic": "Scope & Lifetime", "level": "Interview", "q": "What is the main issue with excessive global state?", "code": "", "options": ["It always makes code faster", "It can make code harder to reason about and test", "It prevents functions", "It removes variables"], "answer": 1, "hints": ["Global state can be changed from many places.", "That creates hidden dependencies.", "Functions with explicit inputs/outputs are usually easier to test."], "id": 29}, {"type": "mcq", "topic": "Default & Keyword Arguments", "level": "Beginner", "q": "What is printed?", "code": "def greet(name='Guest'):\n    print(name)\ngreet()", "options": ["Guest", "name", "None", "Error"], "answer": 0, "hints": ["A default is used when no argument is supplied.", "The default value is Guest.", "The function prints the selected name."], "id": 30}, {"type": "mcq", "topic": "Default & Keyword Arguments", "level": "Intermediate", "q": "What is printed?", "code": "def power(n, exp=2):\n    return n ** exp\nprint(power(3))", "options": ["6", "9", "8", "3"], "answer": 1, "hints": ["exp has a default of 2.", "Only n is supplied.", "3 squared is 9."], "id": 31}, {"type": "mcq", "topic": "Default & Keyword Arguments", "level": "Intermediate", "q": "Which definition is invalid?", "code": "", "options": ["def f(a,b=2): pass", "def f(a=1,b=2): pass", "def f(a=1,b): pass", "def f(*args): pass"], "answer": 2, "hints": ["Required positional parameters cannot normally follow default parameters.", "Think about how positional arguments would be assigned.", "The third definition violates that ordering rule."], "id": 32}, {"type": "code", "topic": "Default & Keyword Arguments", "level": "Intermediate", "q": "Create a function area(length, width=1) that returns length*width.", "code": "# Write your solution here", "expected": "Use a default width of 1 and return length * width.", "hints": ["Put width=1 in the definition.", "Return the multiplication.", "Calling area(5) should produce 5."], "id": 33}, {"type": "mcq", "topic": "Default & Keyword Arguments", "level": "Interview", "q": "What is printed?", "code": "def f(a,b=10):\n    return a+b\nprint(f(5,b=20))", "options": ["15", "25", "30", "Error"], "answer": 1, "hints": ["Keyword b=20 overrides the default.", "a receives 5.", "5 + 20 is 25."], "id": 34}, {"type": "mcq", "topic": "*args & **kwargs", "level": "Intermediate", "q": "What type is args inside a function defined with *args?", "code": "def f(*args):\n    print(type(args).__name__)", "options": ["list", "tuple", "set", "dict"], "answer": 1, "hints": ["*args collects extra positional arguments.", "Python packs them into an immutable sequence.", "That sequence is a tuple."], "id": 35}, {"type": "mcq", "topic": "*args & **kwargs", "level": "Intermediate", "q": "What type is kwargs inside a function defined with **kwargs?", "code": "def f(**kwargs):\n    print(type(kwargs).__name__)", "options": ["tuple", "list", "dict", "set"], "answer": 2, "hints": ["**kwargs collects keyword arguments.", "They are represented as name-value pairs.", "Python stores them in a dictionary."], "id": 36}, {"type": "code", "topic": "*args & **kwargs", "level": "Intermediate", "q": "Write a function total(*numbers) that returns the sum of all supplied numbers.", "code": "# Write your solution here", "expected": "Use return sum(numbers).", "hints": ["*numbers collects positional values.", "sum() accepts the tuple of numbers.", "Return the result."], "id": 37}, {"type": "code", "topic": "*args & **kwargs", "level": "Intermediate", "q": "Write a function show_info(**info) that prints each key and value.", "code": "# Write your solution here", "expected": "Loop through info.items() and print each key and value.", "hints": ["**info is a dictionary.", "Use for key, value in info.items().", "Print both values."], "id": 38}, {"type": "mcq", "topic": "*args & **kwargs", "level": "Interview", "q": "What does f(1,2,x=3,y=4) collect in f(*args, **kwargs)?", "code": "def f(*args, **kwargs): pass", "options": ["args=(1,2), kwargs={'x':3,'y':4}", "args=(x,y), kwargs={1,2}", "args=[1,2,3,4], kwargs={}", "Both are dictionaries"], "answer": 0, "hints": ["Positional values go to *args.", "Named keyword values go to **kwargs.", "args is a tuple and kwargs is a dictionary."], "id": 39}, {"type": "code", "topic": "*args & **kwargs", "level": "Advanced", "q": "Write a function that accepts any number of positional numbers and optional keyword multiplier=1, then returns their sum multiplied by multiplier.", "code": "# Write your solution here", "expected": "Use def calculate(*numbers, multiplier=1): return sum(numbers) * multiplier.", "hints": ["Collect numbers with *numbers.", "Make multiplier a keyword-only default parameter.", "Multiply the sum by multiplier."], "id": 40}, {"type": "mcq", "topic": "Lambda Functions", "level": "Intermediate", "q": "Which is a valid lambda that squares x?", "code": "", "options": ["lambda x: x**2", "lambda: x => x**2", "lambda x => x**2", "def lambda(x): x**2"], "answer": 0, "hints": ["A lambda uses the word lambda followed by parameters.", "A colon separates parameters from the expression.", "The body is an expression."], "id": 41}, {"type": "mcq", "topic": "Lambda Functions", "level": "Intermediate", "q": "What is printed?", "code": "f=lambda x:x+1\nprint(f(4))", "options": ["4", "5", "1", "Error"], "answer": 1, "hints": ["The lambda adds 1.", "Calling f with 4 passes x=4.", "4+1 equals 5."], "id": 42}, {"type": "mcq", "topic": "Lambda Functions", "level": "Interview", "q": "What does sorted(words, key=lambda x: len(x)) do?", "code": "words=['bbb','a','cc']", "options": ["Sorts alphabetically", "Sorts by word length", "Reverses the list", "Counts words"], "answer": 1, "hints": ["The key function returns len(x).", "sorted compares those key values.", "Therefore length determines the order."], "id": 43}, {"type": "code", "topic": "Lambda Functions", "level": "Intermediate", "q": "Sort this list of tuples by the second value using sorted() and lambda.", "code": "items=[('a',3),('b',1),('c',2)]\n# Write your solution here", "expected": "Use sorted(items, key=lambda x: x[1]).", "hints": ["Each item is a tuple.", "The second element is at index 1.", "Pass that expression as key."], "id": 44}, {"type": "mcq", "topic": "Lambda Functions", "level": "Interview", "q": "What is returned by filter(lambda x:x%2==0,[1,2,3,4])?", "code": "", "options": ["Only odd values", "An iterator containing even values", "A tuple of all values", "A boolean"], "answer": 1, "hints": ["filter keeps values for which the function is True.", "The condition checks evenness.", "In Python 3, filter returns an iterator."], "id": 45}, {"type": "code", "topic": "Functions + Built-ins", "level": "Interview", "q": "Use map() with a lambda to create a list containing squares of [1,2,3,4].", "code": "nums=[1,2,3,4]\n# Write your solution here", "expected": "Use list(map(lambda x: x**2, nums)).", "hints": ["map applies a function to every element.", "The lambda squares each element.", "Convert the map object to list for a list result."], "id": 46}, {"type": "code", "topic": "Functions + Built-ins", "level": "Interview", "q": "Use filter() to keep only even numbers from a list.", "code": "nums=[1,2,3,4,5,6]\n# Write your solution here", "expected": "Use list(filter(lambda x: x%2==0, nums)).", "hints": ["filter keeps values whose condition is True.", "Use modulo 2.", "Convert the iterator to a list."], "id": 47}, {"type": "code", "topic": "Functions + Built-ins", "level": "Interview", "q": "Sort a list of dictionaries by the 'age' key using a lambda.", "code": "people=[{'name':'A','age':30},{'name':'B','age':20}]\n# Write your solution here", "expected": "Use sorted(people, key=lambda p: p['age']).", "hints": ["Each element is a dictionary.", "The sort key is p['age'].", "sorted returns a new list."], "id": 48}, {"type": "mcq", "topic": "Functions + Built-ins", "level": "Interview", "q": "What does enumerate() provide when used in a loop?", "code": "", "options": ["Only values", "Only indexes", "Index-value pair rs to the variable in the nearest enclosing function scope.", "inner() modifies outer's x directly, not a new local copy.", "outer() returns the updated value, 2."]}, {"topicName": "Default & Keyword Arguments", "type": "mcq", "topic": "default + positional", "level": "Beginner", "question": "What is printed?", "code": "def f(a, b=10):\n    return a + b\nprint(f(5))", "options": ["5", "10", "15", "Error"], "answer": 2, "hints": ["Only a is provided; b uses its default value.", "b defaults to 10.", "5 + 10 = 15."]}, {"topicName": "Default & Keyword Arguments", "type": "mcq", "topic": "override default", "level": "Intermediate", "question": "What is printed?", "code": "def f(a, b=10):\n    return a + b\nprint(f(5, 20))", "options": ["15", "25", "10", "Error"], "answer": 1, "hints": ["Passing a second positional argument overrides the default.", "b becomes 20 instead of 10.", "5 + 20 = 25."]}, {"topicName": "Default & Keyword Arguments", "type": "mcq", "topic": "keyword-only arguments", "level": "Advanced", "question": "What happens?", "code": "def f(a, *, b):\n    return a + b\nprint(f(1, 2))", "options": ["3", "Raises TypeError", "Raises ValueError", "1"], "answer": 1, "hints": ["The * in the parameter list forces b to be passed by keyword only.", "Calling f(1, 2) tries to pass b positionally.", "This raises TypeError: f() takes 1 positional argument but 2 were given."]}, {"topicName": "*args & **kwargs", "type": "mcq", "topic": "*args", "level": "Beginner", "question": "What is printed?", "code": "def f(*args):\n    return sum(args)\nprint(f(1, 2, 3))", "options": ["6", "(1, 2, 3)", "Error", "0"], "answer": 0, "hints": ["*args collects all positional arguments into a tuple.", "args becomes (1, 2, 3).", "sum(args) is 1 + 2 + 3 = 6."]}, {"topicName": "*args & **kwargs", "type": "mcq", "topic": "**kwargs", "level": "Intermediate", "question": "What is printed?", "code": "def f(**kwargs):\n    return kwargs\nprint(f(a=1, b=2))", "options": ["{'a': 1, 'b': 2}", "(1, 2)", "['a', 'b']", "Error"], "answer": 0, "hints": ["**kwargs collects all keyword arguments into a dictionary.", "a=1 and b=2 become entries in that dict.", "The result is {'a': 1, 'b': 2}."]}, {"topicName": "*args & **kwargs", "type": "mcq", "topic": "combining all argument types", "level": "Advanced", "question": "What is printed?", "code": "def f(a, *args, **kwargs):\n    return (a, args, kwargs)\nprint(f(1, 2, 3, x=4))", "options": ["(1, (2, 3), {'x': 4})", "(1, [2, 3], {'x': 4})", "(1, 2, 3, 4)", "Error"], "answer": 0, "hints": ["a takes the first positional argument, 1.", "*args collects the remaining positional arguments as a tuple: (2, 3).", "**kwargs collects keyword arguments as a dict: {'x': 4}."]}, {"topicName": "Lambda Functions", "type": "mcq", "topic": "basic lambda", "level": "Beginner", "question": "What is printed?", "code": "square = lambda x: x * x\nprint(square(5))", "options": ["10", "25", "5", "Error"], "answer": 1, "hints": ["A lambda is a small anonymous function.", "This one squares its input.", "square(5) is 5 * 5 = 25."]}, {"topicName": "Lambda Functions", "type": "mcq", "topic": "lambda with two args", "level": "Intermediate", "question": "What is printed?", "code": "add = lambda a, b: a + b\nprint(add(2, 3))", "options": ["23", "5", "'23'", "Error"], "answer": 1, "hints": ["A lambda can take multiple arguments, separated by commas.", "This one adds its two inputs.", "2 + 3 = 5."]}, {"topicName": "Lambda Functions", "type": "mcq", "topic": "lambda + sorted key", "level": "Advanced", "question": "What is printed?", "code": "nums = [3, 1, 2]\nprint(sorted(nums, key=lambda x: -x))", "options": ["[1, 2, 3]", "[3, 2, 1]", "[3, 1, 2]", "Error"], "answer": 1, "hints": ["The key negates each value before comparing.", "Sorting by the negated value produces descending order.", "The result is [3, 2, 1]."]}, {"topicName": "Functions + Built-ins", "type": "mcq", "topic": "map() + lambda", "level": "Beginner", "question": "What is printed?", "code": "nums = [1, 2, 3]\nprint(list(map(lambda x: x * 2, nums)))", "options": ["[1, 2, 3]", "[2, 4, 6]", "6", "map object"], "answer": 1, "hints": ["map() applies the lambda to every element.", "Each value is doubled.", "The result is [2, 4, 6]."]}, {"topicName": "Functions + Built-ins", "type": "mcq", "topic": "filter() + lambda", "level": "Intermediate", "question": "What is printed?", "code": "nums = [1, 2, 3, 4]\nprint(list(filter(lambda x: x % 2 == 0, nums)))", "options": ["[1, 3]", "[2, 4]", "[1, 2, 3, 4]", "Error"], "answer": 1, "hints": ["filter() keeps items where the lambda returns True.", "The lambda checks for even numbers.", "Only 2 and 4 are even."]}, {"topicName": "Functions + Built-ins", "type": "mcq", "topic": "sorted() + key=len", "level": "Advanced", "question": "What is printed?", "code": "words = ['bb', 'a', 'ccc']\nprint(sorted(words, key=len))", "options": ["['a', 'bb', 'ccc']", "['ccc', 'bb', 'a']", "['bb', 'a', 'ccc']", "Error"], "answer": 0, "hints": ["key=len sorts by each word's length.", "Lengths are 2, 1 and 3 respectively.", "Ordered by length ascending: 'a' (1), 'bb' (2), 'ccc' (3)."]}, {"topicName": "Recursion", "type": "mcq", "topic": "factorial recursion", "level": "Beginner", "question": "What is printed?", "code": "def fact(n):\n    if n <= 1:\n        return 1\n    return n * fact(n - 1)\nprint(fact(4))", "options": ["10", "24", "16", "Error"], "answer": 1, "hints": ["fact(4) = 4 * fact(3) = 4 * 3 * fact(2) = ...", "Unwind the recursion down to fact(1) = 1.", "4 * 3 * 2 * 1 = 24."]}, {"topicName": "Recursion", "type": "mcq", "topic": "base case", "level": "Intermediate", "question": "What must every recursive function have to avoid infinite recursion?", "code": "", "options": ["A base case that stops the recursion", "A return statement of any kind", "A loop inside it", "A default argument"], "answer": 0, "hints": ["Recursive calls must eventually stop.", "A condition that returns without calling itself again provides that stop.", "This is called the base case."]}, {"topicName": "Recursion", "type": "mcq", "topic": "fibonacci recursion", "level": "Advanced", "question": "What is printed?", "code": "def fib(n):\n    if n < 2:\n        return n\n    return fib(n - 1) + fib(n - 2)\nprint(fib(5))", "options": ["3", "5", "8", "Error"], "answer": 1, "hints": ["The Fibonacci sequence starts 0, 1, 1, 2, 3, 5, ...", "fib(5) refers to the 6th term (starting the count at fib(0)).", "That value is 5."]}, {"topicName": "Higher-Order Functions", "type": "mcq", "topic": "definition", "level": "Beginner", "question": "Which best describes a higher-order function?", "code": "", "options": ["A function that takes another function as an argument or returns one", "A function with more than 5 parameters", "A function that only returns numbers", "A function defined inside a class"], "answer": 0, "hints": ["'Higher-order' refers to how functions can be treated as values.", "Such a function accepts or produces other functions.", "That is exactly the definition of a higher-order function."]}, {"topicName": "Higher-Order Functions", "type": "mcq", "topic": "apply a function twice", "level": "Intermediate", "question": "What is printed?", "code": "def apply_twice(f, x):\n    return f(f(x))\nprint(apply_twice(lambda x: x + 3, 2))", "options": ["5", "8", "6", "Error"], "answer": 1, "hints": ["First apply f to 2: 2 + 3 = 5.", "Then apply f again to that result: 5 + 3 = 8.", "apply_twice returns 8."]}, {"topicName": "Higher-Order Functions", "type": "mcq", "topic": "closures", "level": "Advanced", "question": "What is printed?", "code": "def make_multiplier(n):\n    def multiplier(x):\n        return x * n\n    return multiplier\ntimes3 = make_multiplier(3)\nprint(times3(5))", "options": ["8", "15", "3", "Error"], "answer": 1, "hints": ["make_multiplier(3) returns a function that remembers n = 3.", "times3 is that returned function, a closure over n.", "times3(5) computes 5 * 3 = 15."]}, {"topicName": "Advanced Interview Problems", "type": "mcq", "topic": "memoization", "level": "Advanced", "question": "Which built-in decorator can automatically cache a function's results?", "code": "", "options": ["functools.lru_cache", "functools.partial", "itertools.cache", "sys.cache"], "answer": 0, "hints": ["Python's standard library provides a ready-made caching decorator.", "It stores previous results keyed by their arguments.", "That decorator is functools.lru_cache."]}, {"topicName": "Advanced Interview Problems", "type": "mcq", "topic": "closures with state", "level": "Advanced", "question": "What is printed?", "code": "def counter():\n    count = 0\n    def inc():\n        nonlocal count\n        count += 1\n        return count\n    return inc\nc = counter()\nprint(c())\nprint(c())", "options": ["1 then 1", "1 then 2", "0 then 1", "Error"], "answer": 1, "hints": ["c is a closure that remembers count between calls.", "Each call to c() increments count using nonlocal.", "The first call prints 1, and the second prints 2."]}, {"topicName": "Advanced Interview Problems", "type": "mcq", "topic": "mutable default argument risk", "level": "Interview", "question": "What is the main risk of a mutable default argument like def f(x, lst=[])?", "code": "", "options": ["The default list is created once and shared across all calls", "It always raises a SyntaxError", "Python forbids this pattern entirely", "It makes the function run slower"], "answer": 0, "hints": ["Default argument values are evaluated once, when the function is defined.", "If that default is a mutable object, every call without an explicit argument shares it.", "Mutating it in one call leaks into future calls, a classic Python gotcha."]}]};let attempts={},solved={},score=0;
function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function home(){app.innerHTML=`<div class="card"><h2>📚 Python Functions — Version 7</h2><p>Learn each function concept first, then practice with interview-style questions that mix earlier Python topics.</p></div><div class="grid"><div class="card click" onclick="learn()"><span class="badge">11 topics</span><h2>📖 Learn</h2><p>Definition → use case → example → interview focus.</p></div><div class="card click" onclick="practice()"><span class="badge">100 questions</span><h2>🎯 Practice</h2><p>Immediate feedback, progressive hints and coding questions.</p></div></div>`}
const info={
"Function Basics":["A function is a reusable block of code defined with def and executed when called.","Functions reduce duplication, improve organization and make logic reusable and testable.","def add(a,b):\\n    return a+b"],
"Parameters & Arguments":["Parameters are names in a function definition; arguments are values supplied during a call.","They let one function operate on different input values.","def greet(name):\\n    return 'Hello '+name"],
"Return Values":["return sends a value from a function back to its caller and immediately exits that function.","Returned values can be stored, combined in expressions and passed to other functions.","def square(n):\\n    return n*n"],
"Scope & Lifetime":["Scope determines where a name can be accessed; local names belong to a function call.","Understanding scope prevents accidental dependencies and is central to debugging interview questions.","x=10\\ndef f():\\n    x=20\\n    return x"],
"Default & Keyword Arguments":["Default parameters supply fallback values; keyword arguments pass values by parameter name.","They make APIs flexible and readable, but parameter ordering rules matter.","def power(n, exp=2):\\n    return n**exp"],
"*args & **kwargs":["*args collects extra positional arguments into a tuple; **kwargs collects extra keyword arguments into a dictionary.","They are useful when a function accepts a variable number of inputs.","def f(*args, **kwargs):\\n    ..."],
"Lambda Functions":["A lambda is a small anonymous function containing an expression.","Lambdas are commonly used as key functions for sorted(), and with map() or filter().","sorted(words, key=lambda x: len(x))"],
"Functions + Built-ins":["Built-ins such as map, filter, sorted, enumerate and zip become powerful when combined with functions.","Interviewers often ask you to transform, filter or order collections concisely.","list(map(lambda x:x*2, nums))"],
"Recursion":["Recursion is when a function calls itself on a smaller subproblem until a base case is reached.","It is useful for trees, divide-and-conquer and classic algorithm questions.","def fact(n):\\n    if n<=1: return 1\\n    return n*fact(n-1)"],
"Higher-Order Functions":["A higher-order function accepts a function as an argument or returns a function.","This enables callbacks, closures and functional-style composition.","def apply(f,x):\\n    return f(x)"],
"Advanced Interview Problems":["Advanced function questions combine functions with scope, closures, decorators, recursion, data structures and complexity.","Interviewers may ask not just for code but also why the design works and its complexity.","def make_adder(n):\\n    return lambda x:x+n"]
};
function learn(){let x='<button class="secondary" onclick="home()">← Home</button><div class="card"><h2>📖 Function Topics</h2><p>Every topic begins with a definition and use case before practice.</p></div><div class="grid">';DATA.topics.forEach((t,i)=>x+=`<div class="card click" onclick="topic(${i})"><span class="badge">${esc(t[1])}</span><h3>${esc(t[0])}</h3><p>${esc(t[2])}</p></div>`);x+='</div>';app.innerHTML=x}
function topic(i){let t=DATA.topics[i],e=info[t[0]];app.innerHTML=`<button class="secondary" onclick="learn()">← Topics</button><div class="card"><span class="badge">${esc(t[1])}</span><h2>${esc(t[0])}</h2><h3 class="section">Definition</h3><p>${esc(e[0])}</p><h3 class="section">Use case</h3><p>${esc(e[1])}</p><h3 class="section">Example</h3><pre>${esc(e[2])}</pre><h3 class="section">Interview focus</h3><p>Be ready to explain syntax, behavior, edge cases, scope, return values and complexity where relevant.</p><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="primary" onclick="practice()">Practice (all 100)</button><button class="primary" onclick="practiceTopic(i)">Practice this topic only</button></div></div>`}
function practice(){attempts={};solved={};score=0;app.innerHTML=`<button class="secondary" onclick="home()">← Home</button><div class="card"><h2>🎯 100 Functions Questions</h2><p>Wrong MCQs reveal hints instead of the direct answer. Coding questions let you enter your own Python solution.</p><div class="stats"><div class="stat" id="score">Score: 0 / 0</div><div class="stat">100 Questions</div></div></div><div id="questions"></div>`;DATA.questions.forEach(makeQuestion)}
function makeQuestion(q){let d=document.createElement('div');d.className='question';d.id='q'+q.id;let controls=q.type==='mcq'?q.options.map((o,j)=>`<label class="opt" data-o="${j}"><input type="radio" name="q${q.id}" onchange="answer(${q.id},${j})"><span><b>${'ABCD'[j]}.</b> ${esc(o)}</span></label>`).join(''):`<textarea id="code${q.id}" placeholder="Write your Python solution here..."></textarea><button class="primary" onclick="submitCode(${q.id})">Check Code</button><div class="result" id="result${q.id}"></div>`;d.innerHTML=`<span class="badge">${esc(q.topic)} • ${esc(q.level)}</span><h3>${q.id}. ${esc(q.q)}</h3>${q.code?'<pre>'+esc(q.code)+'</pre>':''}${controls}<div id="fb${q.id}"></div><div id="hint${q.id}" class="hint" style="display:none"></div>`;questions.appendChild(d)}
function answer(id,c){let q=DATA.questions.find(x=>x.id===id);if(solved[id])return;attempts[id]=(attempts[id]||0)+1;let d=document.getElementById('q'+id),fb=document.getElementById('fb'+id),h=document.getElementById('hint'+id);d.querySelectorAll('.opt').forEach(x=>x.classList.remove('correct','wrong'));d.querySelector(`[data-o="${c}"]`).classList.add(c===q.answer?'correct':'wrong');if(c===q.answer){solved[id]=1;score++;fb.innerHTML='<p class="ok">✓ Correct!</p>';h.style.display='none'}else{fb.innerHTML='<p class="no">✗ Wrong — direct answer hidden.</p>';h.style.display='block';h.innerHTML='<b>💡 Hint '+Math.min(attempts[id],q.hints.length)+'</b><br>'+esc(q.hints[Math.min(attempts[id],q.hints.length)-1])}updateScore()}
function submitCode(id){let v=document.getElementById('code'+id).value.trim(),q=DATA.questions.find(x=>x.id===id),r=document.getElementById('result'+id);if(!v){r.textContent='Please enter your code first.';return}if(!solved[id]){solved[id]=1;score++}r.innerHTML='<b>Submitted.</b> Use these self-check hints: '+esc(q.hints.join(' '))}
function updateScore(){let done=Object.keys(solved).length;document.getElementById('score').textContent='Score: '+score+' / '+done}
const LEVEL_ORDER={"Beginner":0,"Intermediate":1,"Advanced":2,"Interview":3};
let topicAttempts={},topicSolved={},topicScore=0,currentTopicSet=[];
function practiceTopic(i){
  const t=DATA.topics[i];
  currentTopicSet=DATA.topicQuestions.filter(q=>q.topicName===t[0]).sort((a,b)=>LEVEL_ORDER[a.level]-LEVEL_ORDER[b.level]);
  topicAttempts={};topicSolved={};topicScore=0;
  app.innerHTML=`<button class="secondary" onclick="topic(${i})">\u2190 ${esc(t[0])}</button><div class="card"><h2>\U0001f3af ${esc(t[0])} \u2014 Practice</h2><p>Unique basic-to-advanced questions for this topic only (separate from the main 100-question bank).</p><div class="stats"><div class="stat" id="tscore">Score: 0 / 0</div><div class="stat">${currentTopicSet.length} Questions</div></div></div><div id="tquestions"></div>`;
  currentTopicSet.forEach((q,idx)=>makeTopicQuestion(q,idx));
}
function makeTopicQuestion(q,idx){let d=document.createElement('div');d.className='question';d.id='tq'+idx;let controls=q.type==='mcq'?q.options.map((o,j)=>`<label class="opt" data-o="${j}"><input type="radio" name="tq${idx}" onchange="topicAnswer(${idx},${j})"><span><b>${'ABCD'[j]}.</b> ${esc(o)}</span></label>`).join(''):`<textarea id="tcode${idx}" placeholder="Write your Python solution here..."></textarea><button class="primary" onclick="topicSubmitCode(${idx})">Check Code</button><div class="result" id="tresult${idx}"></div>`;d.innerHTML=`<span class="badge">${esc(q.topic)} \u2022 ${esc(q.level)}</span><h3>${idx+1}. ${esc(q.question)}</h3>${q.code?`<pre>${esc(q.code)}</pre>`:''}${controls}<div id="tfb${idx}"></div><div id="thint${idx}" class="hint" style="display:none"></div>`;tquestions.appendChild(d)}
function topicAnswer(idx,choice){let q=currentTopicSet[idx];if(topicSolved[idx])return;topicAttempts[idx]=(topicAttempts[idx]||0)+1;let n=topicAttempts[idx],d=document.getElementById('tq'+idx),fb=document.getElementById('tfb'+idx),h=document.getElementById('thint'+idx);d.querySelectorAll('.opt').forEach(x=>x.classList.remove('correct','wrong'));d.querySelector(`[data-o="${choice}"]`).classList.add(choice===q.answer?'correct':'wrong');if(choice===q.answer){topicSolved[idx]=1;topicScore++;fb.innerHTML='<p class="ok">\u2713 Correct!</p>';h.style.display='none'}else{fb.innerHTML='<p class="no">\u2717 Wrong \u2014 answer hidden.</p>';h.style.display='block';h.innerHTML='<b>\U0001f4a1 Hint '+Math.min(n,q.hints.length)+'</b><br>'+esc(q.hints[Math.min(n,q.hints.length)-1])}updateTopicScore()}
function topicSubmitCode(idx){let v=document.getElementById('tcode'+idx).value.trim(),q=currentTopicSet[idx],r=document.getElementById('tresult'+idx);if(!v){r.textContent='Please enter your code first.';return}if(!topicSolved[idx]){topicSolved[idx]=1;topicScore++}r.innerHTML='<b>Submitted.</b> Self-check approach: '+esc(q.hints.join(' '));updateTopicScore()}
function updateTopicScore(){let done=Object.keys(topicSolved).length;document.getElementById('tscore').textContent='Score: '+topicScore+' / '+done}
home();
</script></body></html>
