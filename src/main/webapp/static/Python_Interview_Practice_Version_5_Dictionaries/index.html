pected": "Create a dictionary with two key-value pairs and pass it to print().", "hints": ["Use curly braces.", "Separate each key and value with a colon.", "Separate pairs with commas."], "id": 3}, {"type": "mcq", "topic": "Dictionary Basics", "level": "Beginner", "q": "Can dictionary keys normally be duplicated?", "code": "d = {'a':1, 'a':2}\nprint(d)", "options": ["Yes, both values remain", "No, the later value replaces the earlier value", "It always raises an error", "It creates a list"], "answer": 1, "hints": ["Dictionary keys are unique.", "Assigning the same key again updates its value.", "Only one 'a' key remains."], "id": 4}, {"type": "mcq", "topic": "Access & Update", "level": "Beginner", "q": "What is printed?", "code": "d={'a':10}\nd['b']=20\nprint(d['b'])", "options": ["10", "20", "b", "Error"], "answer": 1, "hints": ["Assigning to a new key adds it.", "The value assigned to b is 20.", "Lookup d['b'] returns that value."], "id": 5}, {"type": "mcq", "topic": "Access & Update", "level": "Beginner", "q": "What happens with d['x'] if x does not exist?", "code": "d={'a':1}\nprint(d['x'])", "options": ["None", "0", "KeyError", "False"], "answer": 2, "hints": ["Bracket lookup expects the key to exist.", "Missing keys are not silently converted to None.", "Python raises a specific exception for this case."], "id": 6}, {"type": "code", "topic": "Access & Update", "level": "Beginner", "q": "Safely read a dictionary key that may not exist.", "code": "d={'name':'Ravi'}\n# Try to read 'age' safely", "expected": "Use d.get('age') or d.get('age', default_value).", "hints": ["get() handles missing keys safely.", "You can supply a default value.", "Unlike brackets, get() does not raise KeyError for a missing key."], "id": 7}, {"type": "mcq", "topic": "Access & Update", "level": "Beginner", "q": "What is printed?", "code": "d={'a':1}\nd['a']=5\nprint(d['a'])", "options": ["1", "5", "None", "Error"], "answer": 1, "hints": ["Assignment to an existing key updates it.", "The cy requires remembering each character's count.", "A dictionary maps character to count.", "Loop through the string to update it."], "id": 24}, {"type": "code", "topic": "Dictionaries + Strings", "level": "Interview", "q": "Build a character-frequency dictionary for a string.", "code": "s='banana'\n# Write your solution here", "expected": "Loop through s and use freq[ch] = freq.get(ch, 0) + 1.", "hints": ["Create freq = {}.", "get() gives zero for a missing character.", "Increment the count for each character."], "id": 25}, {"type": "code", "topic": "Dictionaries + Strings", "level": "Interview", "q": "Build a word-frequency dictionary from a sentence.", "code": "sentence='python is easy and python is useful'\n# Write your solution here", "expected": "Split the sentence into words and count each word in a dictionary.", "hints": ["Use split() first.", "Loop through each word.", "Use get(word, 0) + 1."], "id": 26}, {"type": "mcq", "topic": "Built-ins + Dictionaries", "level": "Intermediate", "q": "What does sorted(d) sort by default?", "code": "d={'banana':3,'apple':2,'cat':1}\nprint(sorted(d))", "options": ["Values", "Keys", "Key-value pairs by value", "Dictionary length"], "answer": 1, "hints": ["Iterating a dictionary normally exposes keys.", "sorted receives those keys.", "So the default sorting is by keys."], "id": 27}, {"type": "mcq", "topic": "Built-ins + Dictionaries", "level": "Interview", "q": "Which expression finds the key with the largest value?", "code": "d={'a':10,'b':30,'c':20}", "options": ["max(d, key=d.get)", "max(d.values())", "d.max()", "sorted(d.values())[0]"], "answer": 0, "hints": ["You need the key, not just the value.", "max accepts a key function.", "d.get(key) returns the value used for comparison."], "id": 28}, {"type": "code", "topic": "Built-ins + Dictionaries", "level": "Interview", "q": "Sort dictionary keys by their values from highest to lowest.", "code": "d={'a':10,'b':30,'c':20}\n# Write your solution here", "expected": "Use sorted nces", "Use len() only", "Use reverse()", "Use print()"], "answer": 0, "hints": ["Grouping means one key can have multiple related items.", "A dictionary is useful for key-to-list mapping.", "setdefault is often useful."], "id": 39}, {"type": "code", "topic": "Advanced Interview Problems", "level": "Advanced", "q": "Invert a dictionary when all values are unique.", "code": "d={'a':1,'b':2,'c':3}\n# Write your solution here", "expected": "Use {value: key for key, value in d.items()}.", "hints": ["The old value becomes the new key.", "The old key becomes the new value.", "items() provides both."], "id": 40}, {"type": "code", "topic": "Advanced Interview Problems", "level": "Advanced", "q": "Merge two dictionaries. If a key appears in both, add their numeric values.", "code": "a={'x':10,'y':20}\nb={'y':5,'z':15}\n# Write your solution here", "expected": "Build a result dictionary and add each dictionary's values for matching keys.", "hints": ["Start with a copy of a.", "Loop through b.", "For each key use result[key] = result.get(key, 0) + value."], "id": 41}, {"type": "code", "topic": "Advanced Interview Problems", "level": "Advanced", "q": "Find the first non-repeating character using a dictionary.", "code": "s='swiss'\n# Write your solution here", "expected": "Build character frequencies, then scan s and return the first character with frequency 1.", "hints": ["First pass: count characters.", "Second pass: preserve original order.", "Return the first character whose count is one."], "id": 42}, {"type": "code", "topic": "Advanced Interview Problems", "level": "Advanced", "q": "Create a dictionary of word lengths, then find the longest word.", "code": "sentence='Python interviews require practice'\n# Write your solution here", "expected": "Build {word: len(word) for word in sentence.split()} and select the key with maximum value.", "hints": ["Split into words.", "Create a word-to-length mapping.", "Use max(dictionary, key=dictionary.get)."], "id": 43}, {"type": "code" ror"], "answer": 0, "hints": ["Each key maps to whether that number is even.", "1 and 3 are odd (False); 2 is even (True).", "The result is {1: False, 2: True, 3: False}."]}, {"topicName": "Dictionary Comprehension", "type": "mcq", "topic": "comprehension + filter", "level": "Advanced", "question": "What is printed?", "code": "words = ['a', 'bb', 'ccc']\nprint({w: len(w) for w in words if len(w) > 1})", "options": ["{'bb': 2, 'ccc': 3}", "{'a': 1, 'bb': 2, 'ccc': 3}", "['bb', 'ccc']", "Error"], "answer": 0, "hints": ["The if clause filters which words are included.", "'a' has length 1, which does not pass len(w) > 1.", "Only 'bb' and 'ccc' remain, mapped to their lengths."]}, {"topicName": "Frequency & Counting", "type": "mcq", "topic": "count() on string", "level": "Beginner", "question": "What is printed?", "code": "text = 'aabbbc'\nprint(text.count('b'))", "options": ["2", "3", "1", "0"], "answer": 1, "hints": ["count() tallies occurrences of a substring.", "'b' appears three times in 'aabbbc'.", "The result is 3."]}, {"topicName": "Frequency & Counting", "type": "mcq", "topic": "Counter output", "level": "Intermediate", "question": "What is printed?", "code": "from collections import Counter\nprint(Counter('aab'))", "options": ["Counter({'a': 2, 'b': 1})", "{'a': 2, 'b': 1}", "['a', 'a', 'b']", "Error"], "answer": 0, "hints": ["Counter counts occurrences of each character.", "'a' appears twice, 'b' appears once.", "Counter's repr looks like Counter({'a': 2, 'b': 1})."]}, {"topicName": "Frequency & Counting", "type": "mcq", "topic": "most_common()", "level": "Advanced", "question": "Which method returns the n most frequent items from a Counter?", "code": "", "options": ["most_common(n)", "top(n)", "sorted(n)", "n_common()"], "answer": 0, "hints": ["Counter objects have a dedicated ranking method.", "It returns a list of (item, count) pairs.", "That method is most_common(n)."]}, {"topicName": "Nested Dictionaries", "type": "mcq", "topic": "nested access", "level": "Beginner", "question": "What is printed?", "code": "d = {'a': {'x': 1}}\nprint(d['a']['x'])", "options": ["1", "{'x': 1}", "'a'", "Error"], "answer": 0, "hints": ["d['a'] returns the inner dictionary {'x': 1}.", "Then ['x'] looks up its value.", "The result is 1."]}, {"topicName": "Nested Dictionaries", "type": "mcq", "topic": "nested update", "level": "Intermediate", "question": "What is printed?", "code": "d = {'a': {'x': 1}}\nd['a']['y'] = 2\nprint(d)", "options": ["{'a': {'x': 1}}", "{'a': {'x': 1, 'y': 2}}", "{'a': {'y': 2}}", "Error"], "answer": 1, "hints": ["d['a'] refers to the inner dictionary.", "Assigning to ['y'] adds a new key to that inner dict.", "The result is {'a': {'x': 1, 'y': 2}}."]}, {"topicName": "Nested Dictionaries", "type": "mcq", "topic": "safe nested get", "level": "Advanced", "question": "What is printed?", "code": "d = {'a': {'x': 1}}\nprint(d.get('b', {}).get('x', 'missing'))", "options": ["1", "'missing'", "Raises KeyError", "None"], "answer": 1, "hints": ["d.get('b', {}) safely returns an empty dict since 'b' is absent.", "Calling .get('x', 'missing') on that empty dict finds nothing.", "The fallback 'missing' is returned."]}, {"topicName": "Advanced Interview Problems", "type": "mcq", "topic": "merging dicts", "level": "Advanced", "question": "Which correctly merges two dictionaries in Python 3.9+?", "code": "d1 = {'a': 1}\nd2 = {'b': 2}", "options": ["d1 | d2", "d1 & d2", "d1 + d2", "d1.merge(d2)"], "answer": 0, "hints": ["Python 3.9 introduced a dedicated merge operator for dicts.", "It uses the same symbol as set union.", "d1 | d2 merges the two dictionaries."]}, {"topicName": "Advanced Interview Problems", "type": "mcq", "topic": "inverting a dict", "level": "Advanced", "question": "Which correctly inverts a dictionary (swaps keys and values), assuming values are unique?", "code": "d = {'a': 1, 'b': 2}", "options": ["{v: k for k, v in d.items()}", "{k: v for v, k in d.items()}", "dict(reversed(d))", "d[::-1]"], "answer": 0, "hi function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function home(){app.innerHTML=`<div class="card"><h2>📚 Python Dictionaries — Version 5</h2><p>Learn dictionaries from basic key-value concepts through advanced interview problems. Later questions deliberately combine <b>for loops + built-ins + lists + strings + dictionaries</b>.</p></div><div class="grid"><div class="card click" onclick="learn()"><span class="badge">11 topics</span><h2>📖 Learn</h2><p>Definition → use case → example → interview focus.</p></div><div class="card click" onclick="practice()"><span class="badge">100 questions</span><h2>🎯 Practice</h2><p>Immediate feedback, progressive hints and coding questions.</p></div></div>`}
const info={
"Dictionary Basics":["A dictionary is a mutable mapping of unique keys to values.","Use it when data is naturally represented as key → value, such as user profiles or lookup tables.","d={'name':'Ravi','age':25}"],

function learn(){let x='<button class="secondary" onclick="home()">← Home</button><div class="card"><h2>📖 Dictionary Topics</h2><p>Before every new function or concept, understand the definition and use case.</p></div><div class="grid">';DATA.topics.forEach((t,i)=>x+=`<div class="card click" onclick="topic(${i})"><span class="badge">${esc(t[1])}</span><h3>${esc(t[0])}</h3><p>${esc(t[2])}</p></div>`);x+='</div>';app.innerHTML=x}
function topic(i){let t=DATA.topics[i],e=info[t[0]];app.innerHTML=`<button class="secondary" onclick="learn()">← Topics</button><div class="card"><span class="badge">${esc(t[1])}</span><h2>${esc(t[0])}</h2><h3 class="section">Definition</h3><p>${esc(e[0])}</p><h3 class="section">Use case</h3><p>${esc(e[1])}</p><h3 class="section">Example</h3><pre>${esc(e[2])}</pre><h3 class="section">Interview focus</h3><p>Know syntax, return values, mutation, missing-key behavior, edge cases and how the concept combines with previous modules.</p><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="primary" onclick="practice()">Practice (all 100)</button><button class="primary" onclick="practiceTopic(i)">Practice this topic only</button></div></div>`}
function practice(){attempts={};solved={};score=0;app.innerHTML=`<button class="secondary" onclick="home()">← Home</button><div class="card"><h2>🎯 100 Dictionary Questions</h2><p>Wrong MCQ answers stay hidden. Hints become progressively more specific. Coding questions let you write your own solution.</p><div class="stats"><div class="stat" id="score">Score: 0 / 0</div><div class="stat">100 Questions</div></div></div><div id="questions"></div>`;DATA.questions.forEach(makeQuestion)}
function makeQuestion(q){let d=document.createElement('div');d.className='question';d.id='q'+q.id;let controls=q.type==='mcq'?q.options.map((o,j)=>`<label class="opt" data-o="${j}"><input type="radio" name="q${q.id}" onchange="answer(${q.id},${j})"><span><b>${'ABCD'[j]}.</b> ${esc(o)}</span></label>`).join(''):`<textarea id="code${q.id}" placeholder="Write your Python solution here..."></textarea><button class="primary" onclick="submitCode(${q.id})">Check Code</button><div class="result" id="result${q.id}"></div>`;d.innerHTML=`<span class="badge">${esc(q.topic)} • ${esc(q.level)}</span><h3>${q.id}. ${esc(q.q)}</h3>${q.code?'<pre>'+esc(q.code)+'</pre>':''}${controls}<div id="fb${q.id}"></div><div id="hint${q.id}" class="hint" style="display:none"></div>`;questions.appendChild(d)}
function answer(id,c){let q=DATA.questions.find(x=>x.id===id);if(solved[id])return;attempts[id]=(attempts[id]||0)+1;let n=attempts[id],d=document.getElementById('q'+id),fb=document.getElementById('fb'+id),h=document.getElementById('hint'+id);d.querySelectorAll('.opt').forEach(x=>x.classList.remove('correct','wrong'));d.querySelector(`[data-o="${c}"]`).classList.add(c===q.answer?'correct':'wrong');if(c===q.answer){solved[id]=1;score++;fb.innerHTML='<p class="ok">✓ Correct!</p>';h.style.display='none'}else{fb.innerHTML='<p class="no">✗ Wrong — direct answer hidden.</p>';h.style.display='block';h.innerHTML='<b>💡 Hint '+Math.min(n,q.hints.length)+'</b><br>'+esc(q.hints[Math.min(n,q.hints.length)-1])}updateScore()}
function submitCode(id){let v=document.getElementById('code'+id).value.trim(),q=DATA.questions.find(x=>x.id===id),r=document.getElementById('result'+id);if(!v){r.textContent='Please enter your code first.';return}if(!solved[id]){solved[id]=1;score++}r.innerHTML='<b>Submitted.</b> Self-check using these hints: '+esc(q.hints.join(' '));updateScore()}

function makeTopicQuestion(q,idx){let d=document.createElement('div');d.className='question';d.id='tq'+idx;let controls=q.type==='mcq'?q.options.map((o,j)=>`<label class="opt" data-o="${j}"><input type="radio" name="tq${idx}" onchange="topicAnswer(${idx},${j})"><span><b>${'ABCD'[j]}.</b> ${esc(o)}</span></label>`).join(''):`<textarea id="tcode${idx}" placeholder="Write your Python solution here..."></textarea><button class="primary" onclick="topicSubmitCode(${idx})">Check Code</button><div class="result" id="tresult${idx}"></div>`;d.innerHTML=`<span class="badge">${esc(q.topic)} \u2022 ${esc(q.level)}</span><h3>${idx+1}. ${esc(q.question)}</h3>${q.code?`<pre>${esc(q.code)}</pre>`:''}${controls}<div id="tfb${idx}"></div><div id="thint${idx}" class="hint" style="display:none"></div>`;tquestions.appendChild(d)}
function topicAnswer(idx,choice){let q=currentTopicSet[idx];if(topicSolved[idx])return;topicAttempts[idx]=(topicAttempts[idx]||0)+1;let n=topicAttempts[idx],d=document.getElementById('tq'+idx),fb=document.getElementById('tfb'+idx),h=document.getElementById('thint'+idx);d.querySelectorAll('.opt').forEach(x=>x.classList.remove('correct','wrong'));d.querySelector(`[data-o="${choice}"]`).classList.add(choice===q.answer?'correct':'wrong');if(choice===q.answer){topicSolved[idx]=1;topicScore++;fb.innerHTML='<p class="ok">\u2713 Correct!</p>';h.style.display='none'}else{fb.innerHTML='<p class="no">\u2717 Wrong \u2014 answer hidden.</p>';h.style.display='block';h.innerHTML='<b>\U0001f4a1 Hint '+Math.min(n,q.hints.length)+'</b><br>'+esc(q.hints[Math.min(n,q.hints.length)-1])}updateTopicScore()}
function topicSubmitCode(idx){let v=document.getElementById('tcode'+idx).value.trim(),q=currentTopicSet[idx],r=document.getElementById('tresult'+idx);if(!v){r.textContent='Please enter your code first.';return}if(!topicSolved[idx]){topicSolved[idx]=1;topicScore++}r.innerHTML='<b>Submitted.</b> Self-check approach: '+esc(q.hints.join(' '));updateTopicScore()}
